<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Lapzo</title>
<meta name="description" content="Portal Lapzo: acceso a los módulos internos de reportes y KPIs.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared/css/portal.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b55fe'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
</head>

<body>

<!-- ==========================================================================
     LOGIN
     Sin registro público: las cuentas se crean en Supabase Authentication.
     ========================================================================== -->
<div class="login-wrap hidden" id="viewLogin">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-text">
        <strong>Portal Lapzo</strong>
        <span>Acceso interno</span>
      </span>
    </div>

    <h1>Inicia sesión</h1>
    <p class="lede">Usa el correo con el que te dieron acceso.</p>

    <div class="field">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="username" inputmode="email"
             placeholder="nombre@lapzo.com">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <button class="btn btn-primary btn-block" id="btnLogin">Iniciar sesión</button>

    <div id="loginNotice"></div>

    <p class="login-foot">
      Si no puedes entrar, pide a un administrador que revise tu acceso.
      El portal no crea cuentas nuevas desde aquí.
    </p>
  </div>
</div>

<!-- ==========================================================================
     APLICACIÓN (inicio y administración)
     No se pinta nada hasta que Supabase confirma sesión y permisos.
     ========================================================================== -->
<div class="hidden" id="viewApp">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-text">
        <strong>Portal Lapzo</strong>
        <span id="topSub">Módulos internos</span>
      </span>
    </div>
    <div class="who">
      <span class="id">
        <b id="whoName">—</b>
        <span id="whoEmail">—</span>
      </span>
      <span class="badge hidden" id="whoBadge">Superadmin</span>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Cerrar sesión</button>
    </div>
  </header>

  <main class="view" id="appView">
    <div class="skeleton" id="bootSkeleton" aria-hidden="true">
      <div class="sk"></div><div class="sk"></div>
    </div>
  </main>
</div>

<!-- Estado inicial: mientras se resuelve la sesión no se muestra ninguna de las
     dos vistas anteriores, para no parpadear entre login y portal. -->
<div class="login-wrap" id="viewBoot">
  <div style="text-align:center">
    <div class="brand" style="justify-content:center">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-text"><strong>Portal Lapzo</strong><span>Verificando tu sesión…</span></span>
    </div>
  </div>
</div>

<script src="shared/js/config.js"></script>
<script src="shared/js/supabase.js"></script>
<script src="shared/js/auth.js"></script>
<script src="shared/js/permissions.js"></script>
<script src="shared/js/guard.js"></script>
<script src="shared/js/admin.js"></script>
<script src="shared/js/portal.js"></script>
</body>
</html>
