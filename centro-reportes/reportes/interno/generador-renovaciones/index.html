function buildIssues(){
  const E=S.ext, out=[];
  const add=o=>out.push(Object.assign({choice:null,custom:''},o));
  // 1) total del documento vs suma de productos
  const suma=round2(S.prods.filter(p=>esPagado(p.base)).reduce((a,p)=>a+(p.base.final||0),0));
  const sinPrecio=S.prods.filter(p=>!esPagado(p.base));
  if(E.cond.total!=null&&suma>0&&Math.abs(E.cond.total-suma)>1){
    add({id:'total',sev:'info',title:'El total no coincide con la suma de productos',
      rows:[['Valor total del servicio (cuerpo)',money(E.cond.total)],['Suma de los productos con precio',money(suma)],
            ['Diferencia',money(round2(E.cond.total-suma))]]
            .concat(sinPrecio.length?[['Productos sin importe (no suman)',sinPrecio.map(p=>(p.base.nombre||'').slice(0,24)+': '+(pricingLabel(p.base)||PRICING[p.base.pricing||'unknown'].l)).join(' · ')]]:[]),
      q:'¿Qué total del acuerdo anterior debe usarse como referencia para la comparación?',
      options:[{v:'suma',l:'Suma de productos: '+money(suma)},{v:'doc',l:'Total del documento: '+money(E.cond.total)},{v:'otro',l:'Otro'}]});
  }
  // 2) parcialidades vs total
  const sp=round2((E.cond.pagos||[]).reduce((a,p)=>a+(p.monto||0),0));
  const ref=E.cond.total!=null?E.cond.total:suma;
  if((E.cond.pagos||[]).length&&ref&&Math.abs(sp-ref)>1){
    add({id:'pagos',sev:'info',title:'Las parcialidades no suman el valor total',
      rows:[['Suma del plan de pagos ('+E.cond.pagos.length+' pagos)',money(sp)],['Valor total de referencia',money(ref)],
            ['Diferencia',money(round2(sp-ref))]],
      q:'¿Cómo se procede en la renovación?',
      options:[{v:'recalc',l:'Recalcular el plan de pagos con el nuevo total (recomendado)'},
               {v:'manual',l:'Definir manualmente cada parcialidad en el paso de Forma de pago'}]});
  }
  // 3) naturaleza del descuento por producto
  // la diferencia entre precio lista y precio final del acuerdo anterior NO genera descuento
  // ni inconsistencia: la base de la renovación es siempre el valor contratado (precio final).
  // 4) licencias / colaboradores: cuerpo vs Anexo A
  const bodyLic=(S.prods[0]&&S.prods[0].base.licenciasRaw||'').trim();
  const anx=(E.anexo.colaboradores||'').trim();
  if(bodyLic&&anx&&norm(bodyLic)!==norm(anx)){
    add({id:'lic',sev:'info',title:'Colaboradores / licencias distintos entre el cuerpo y el Anexo A',
      rows:[['Cuerpo del acuerdo',bodyLic],['Anexo A',anx]],
      q:'¿Qué información debe usarse en la renovación?',
      options:[{v:bodyLic,l:bodyLic+'  (cuerpo)'},{v:anx,l:anx+'  (Anexo A)'},{v:'otro',l:'Otro'}]});
  }
  // 5) coherencia de fechas
  const ini=parseDate(E.vig.inicioRaw), rn=parseDate(E.vig.renovRaw);
  if(ini&&rn){
    // la duración leída no genera inconsistencias: la nueva vigencia usa la regla de negocio

    const fuera=(E.cond.pagos||[]).filter(p=>{const d=parseDate(p.fechaRaw);return d&&(dNum(d)<dNum(ini)||dNum(d)>dNum(rn));});
    if(fuera.length)
      add({id:'pagofuera',sev:'info',title:'Hay fechas de pago fuera de la vigencia del acuerdo anterior',
        rows:[['Vigencia',dEs(ini)+' → '+dEs(rn)],['Pagos fuera de rango',fuera.map(f=>f.fechaRaw).join(', ')]],
        q:'Sólo informativo: el nuevo plan de pagos se generará dentro de la nueva vigencia.',options:[]});
  }
  // 6) productos del cuerpo vs Anexo A
  if(E.anexo.plan&&S.prods.length){
    const hit=S.prods.some(p=>norm(p.base.nombre).indexOf(norm(E.anexo.plan).slice(0,10))>=0);
    if(!hit)add({id:'anexoprod',sev:'info',title:'El plan del Anexo A no aparece igual en la tabla de productos',
      rows:[['Anexo A',E.anexo.plan],['Productos del cuerpo',S.prods.map(p=>p.base.nombre).join(' · ')]],
      q:'Verifica que el Anexo A de la renovación refleje los productos correctos.',options:[]});
  }
  // 7) precio del Anexo A vs precio final del cuerpo
  const anexoFin=parseNum(E.anexo.finalRaw);
  if(anexoFin!=null&&ref&&Math.abs(anexoFin-ref)>1){
    add({id:'anexoprecio',sev:'info',title:'El precio del Anexo A no coincide con el valor total del acuerdo',
      rows:[['Anexo A',money(anexoFin)],['Valor total del acuerdo',money(ref)]],
      q:'¿Qué valor representa el precio realmente contratado?',
      options:[{v:'cuerpo',l:'El del cuerpo del acuerdo: '+money(ref)},{v:'anexo',l:'El del Anexo A: '+money(anexoFin)},{v:'otro',l:'Otro'}]});
  }
  // 8) firmantes / razón social
  if(E.emp.razon&&E.per.firmaCliente.empresa&&norm(E.emp.razon)!==norm(E.per.firmaCliente.empresa))
    add({id:'razon',sev:'info',title:'La razón social del bloque de firma no es idéntica a la de los datos del cliente',
      rows:[['Datos del cliente',E.emp.razon],['Bloque de firma',E.per.firmaCliente.empresa]],
      q:'Revisa cuál es la razón social correcta antes de generar el acuerdo.',options:[]});
  // 9) Anexo A gráfico
  if((S.src.bodyImgs||[]).length)
    add({id:'anexoimg',sev:'info',title:'El Anexo A del acuerdo cargado es una imagen, no texto',
      rows:[['Imágenes incrustadas',String((S.src.bodyImgs||[]).length)]],
      q:'Los importes dentro de la imagen no se pueden editar como texto. En el paso «Generar acuerdo» eliges si se regenera con los datos nuevos, se conserva la imagen original o subes una nueva.',options:[]});
  return out;
}
const issuesPendientes=()=>S.issues.filter(i=>i.sev==='block'&&!(i.choice&&(i.choice!=='otro'||String(i.custom).trim())));
function applyIssue(iss){
  const v=iss.choice==='otro'?String(iss.custom).trim():iss.choice;
  if(!v)return;
  if(iss.id==='total'){
    if(iss.choice==='suma')S.baseTotalAnt=round2(S.prods.reduce((a,p)=>a+(p.base.final||0),0));
    else if(iss.choice==='doc')S.baseTotalAnt=S.ext.cond.total;
    else S.baseTotalAnt=parseNum(v);
    S.baseTotalAntManual=true;
  }
  if(iss.id==='pagos'){S.pay.auto=iss.choice==='recalc';if(S.pay.auto)recalcPagos(true);}
  if(iss.id.startsWith('desc:')){
    const p=S.prods.find(x=>x.id===+iss.id.split(':')[1]);
    if(p){
      const diff=round2((p.base.lista||0)-(p.base.final||0));
      if(iss.choice==='pct'){p.base.descTipo='pct';p.base.descVal=Math.round(diff/(p.base.lista||1)*1000000)/10000;}
      else if(iss.choice==='monto'){p.base.descTipo='monto';p.base.descVal=diff;}
      else{const n=parseNum(v);const pct=/%/.test(v)||(n!=null&&n<=100&&!/\$/.test(v));p.base.descTipo=pct?'pct':'monto';p.base.descVal=n||0;}
      p.cur.descTipo=p.base.descTipo;p.cur.descVal=p.base.descVal;
    }
  }
  if(iss.id==='lic'){
    if(S.prods[0]){S.prods[0].cur.licenciasRaw=v;S.prods[0].base.licenciasRaw=v;}
    S.colab.ant=v;S.colab.nue=v;syncAnexo();
  }
  if(iss.id==='fechas'){
    let d=null;
    if(iss.choice==='doc')d=parseDate(S.ext.vig.renovRaw);
    else if(iss.choice==='calc')d=addMonths(parseDate(S.ext.vig.inicioRaw),S.ext.vig.meses||12);
    else d=parseDate(v);
    if(d){S.ren.inicio=d;S.ren.renov=addMonths(d,S.ren.meses);recalcPagos(true);}
  }
  if(iss.id==='anexoprecio'){
    if(iss.choice==='anexo'){const n=parseNum(S.ext.anexo.finalRaw);if(n!=null)S.baseTotalAnt=n;}
    else if(iss.choice==='otro'){const n=parseNum(v);if(n!=null)S.baseTotalAnt=n;}
  }
}

const STEPS=[{n:1,t:'Acuerdo anterior'},{n:2,t:'Validación'},{n:3,t:'Logo del cliente'},{n:4,t:'Renovación'},
             {n:5,t:'Personas'},{n:6,t:'Productos'},{n:7,t:'Forma de pago'},{n:8,t:'Resumen'},{n:9,t:'Generar acuerdo'}];
const NSTEPS=STEPS.length;
function setPath(path,val){
  const p=path.split('.');let o=S;
  for(let i=0;i<p.length-1;i++)o=o[Array.isArray(o)?+p[i]:p[i]];
  o[p[p.length-1]]=val;
}
function getPath(path){
  const p=path.split('.');let o=S;
  for(const k of p){if(o==null)return null;o=o[Array.isArray(o)?+k:k];}
  return o;
}
function normalizeExt(E){
  (E.prods||[]).forEach(p=>{p.lista=parseNum(p.listaRaw);p.final=parseNum(p.finalRaw);
    if(p.lista!=null&&p.final!=null&&p.lista>p.final){p.descTipo=p.descTipo||'pct';}});
  E.cond.total=parseNum(E.cond.totalRaw);
  (E.cond.pagos||[]).forEach(p=>{p.monto=parseNum(p.montoRaw);});
  const m=parseNum(E.vig.mesesRaw);if(m)E.vig.meses=m;
  return E;
}
function say(t,spin){$('#status').innerHTML=(spin?'<span class="spin"></span> ':'')+esc(t||'');}
function goto(n){
  if(n<1||n>NSTEPS)return;
  S.step=n;S.maxStep=Math.max(S.maxStep,n);
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function stepBlocked(n){
  if(docTrabajando())return 'Estamos procesando el acuerdo: '+(S.docStage||'un momento')+'.';
  if(n>=2&&!S.ext)return 'Carga y revisa el acuerdo anterior.';
  if(n>=2){
    const pend=Object.keys(BLOQUES).filter(k=>blkStatus(k)==='pending');
    if(pend.length)return 'Elige Mantener o Editar en cada bloque ('+pend.length+' sin responder).';
    const edit=Object.keys(BLOQUES).filter(blkDirty);
    if(edit.length)return 'Tienes cambios sin guardar en «'+BLOQUES[edit[0]].t+'»: guarda o cancela.';
    // los datos de pasos posteriores (productos, licencias, precios) NO bloquean navegar:
    // se guardan como pendientes y se resuelven en su paso.
  }
  // el resto (inflación, vigencia, logo, inconsistencias, productos) no bloquea navegar:
  // se valida al generar el documento final. Ver erroresBloqueantes().
  return '';
}
function render(){
  if(S.ext)guardarBorrador();
  if(S.gen&&S.gen.version!==S.stateVersion&&S.previewStatus!=='generating')S.previewStatus='outdated';
  const nPend=S.ext?pendientesRevision().length:0;
  $('#chips').innerHTML=STEPS.map(s=>{
    const cls=s.n===S.step?'chip on':(s.n<=S.maxStep&&!stepBlocked(s.n)?'chip done':'chip dis');
    const marca=(s.n===6&&nPend)?' • '+nPend+' pendiente'+(nPend>1?'s':''):'';
    return '<button class="'+cls+'" data-act="go" data-arg="'+s.n+'">'+s.n+'. '+esc(s.t)+esc(marca)+'</button>';
  }).join('');
  $('#prog').style.width=(S.step/NSTEPS*100)+'%';
  const v=[view1,view2,viewLogo,view3,view4,view5,view6,view7,view8][S.step-1];
  $('#stage').innerHTML=v();
  $('#bBack').disabled=S.step===1;
  const blk=stepBlocked(S.step+1);
  $('#bNext').disabled=S.step===NSTEPS||!!blk;
  $('#bNext').textContent=S.step===NSTEPS-1?'Ir a generar →':'Continuar →';
  say(blk||'');
  if(S.step===NSTEPS)afterView8();
  if(S.step===1)setTimeout(aplicarFoco,60);
}

    const aviso=hayCambiosSinGuardar()?'Tienes cambios sin guardar en un bloque y se borrará toda la información del cliente actual. ¿Continuar?':'Se borrará toda la información del cliente actual. ¿Continuar?';
    if(!S.ext||confirm(aviso)){borrarBorrador();S=blankState();PID=0;PIDSEQ=0;render();}
  };
  $('#stage').addEventListener('click',ev=>{
    const b=ev.target.closest('[data-act]');
    if(b){ev.preventDefault();actions(b.dataset.act,b.dataset.arg,b);}
  });
  $('#chips').addEventListener('click',ev=>{
    const b=ev.target.closest('[data-act]');
    if(b)actions(b.dataset.act,b.dataset.arg,b);
  });
  const bind=(ev,full)=>{
    $('#stage').addEventListener(ev,e=>{
      const el=e.target;
      if(!el.dataset)return;
      if(el.dataset.set){
        actions(el.dataset.set,el.type==='checkbox'?(el.checked?'1':''):el.value,el);
        if(full)render();else refreshLive();
        return;
      }
      if(!el.dataset.bind)return;
      let v=el.type==='checkbox'?el.checked:el.value;
      if(el.dataset.num!=null&&el.type!=='checkbox')v=el.value===''?null:parseNum(el.value);
      if(el.dataset.int!=null)v=el.value===''?null:Math.max(1,parseInt(el.value,10)||1);
      setPath(el.dataset.bind,v);
      tocarEstado();
      if(el.dataset.after)actions(el.dataset.after,el.dataset.arg,el);
      if(el.dataset.draft){refreshLive();return;}   // borrador: ni guarda ni cierra el bloque
      if(full)render();else refreshLive();
    });
  };
  bind('input',false);bind('change',true);
  render();
});
function refreshLive(){
  const bq=stepBlocked(S.step+1);
  $('#bNext').disabled=S.step===NSTEPS||!!bq;say(bq||'');
  if(S.step===4){const e=$('#liveVig');if(e)e.innerHTML=vigHtml();const i=$('#liveInf');if(i)i.innerHTML=inflHtml();}
  if(S.step===5){
    S.prods.forEach((p,i)=>{const e=$('#chain'+p.id);if(e)e.innerHTML=chainHtml(p);});
    const t=$('#liveTot');if(t)t.innerHTML=totalsHtml();
  }
  if(S.step===6){const e=$('#livePay');if(e)e.innerHTML=payTableHtml();}
}

/* ---------- estado del documento: idle → uploading → parsing → extracting →
   validating → success | error.  Siempre hay feedback visual. ---------- */
const DOC_ETAPAS={
  uploading:'Cargando documento…',
  parsing:'Leyendo información del acuerdo…',
  identifying:'Identificando cliente y responsables…',
  extracting:'Extrayendo vigencia y productos…',
  pricing:'Analizando precios y condiciones comerciales…',
  annex:'Revisando el Anexo A…',
  validating:'Validando información…',
  success:'Acuerdo procesado correctamente',
  error:'No pudimos procesar completamente este acuerdo'
};
const DOC_TRABAJANDO=['uploading','parsing','identifying','extracting','pricing','annex','validating'];
const docTrabajando=()=>DOC_TRABAJANDO.indexOf(S.docStatus)>=0;
function setDocStage(st,detalle){
  S.docStatus=st;
  S.docStage=DOC_ETAPAS[st]||st;
  if(detalle!=null)S.docDetalle=detalle;
  const t=$('#loadStage'),d=$('#loadDetalle');
  if(t)t.textContent=S.docStage;
  if(d&&S.docDetalle)d.textContent=S.docDetalle;
  if(!t)render();
  return new Promise(r=>setTimeout(r,0));      // deja pintar la interfaz antes de seguir
}
let DOC_TIMERS=[];
function mensajesLargos(){
  DOC_TIMERS.forEach(clearTimeout);
  DOC_TIMERS=[
    setTimeout(()=>{if(docTrabajando())setDocStage(S.docStatus,'El documento contiene varias páginas. Seguimos analizando la información.');},6000),
    setTimeout(()=>{if(docTrabajando())setDocStage(S.docStatus,'Estamos revisando tablas y anexos. Esto puede tardar un momento.');},14000)
  ];
}
async function handleFile(file){
  if(!file)return;
  if(docTrabajando())return;                   // no se procesa otro documento encima
  if(hayCambiosSinGuardar()&&!confirm('Tienes cambios sin guardar en un bloque. Al cargar otro acuerdo se perderán. ¿Continuar?'))return;
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext!=='pdf'&&ext!=='docx'){
    S=blankState();S.docStatus='error';S.docStage=DOC_ETAPAS.error;
    S.docDetalle='Sólo se admiten archivos PDF o DOCX.';S.docFileName=file.name;render();return;
  }
  S=blankState();PID=0;
  S.docFile=file;S.docFileName=file.name;
  await setDocStage('uploading','Estamos leyendo y organizando la información del acuerdo anterior.');
  mensajesLargos();
  try{
    const ab=await file.arrayBuffer();
    await setDocStage('parsing');
    S.src=ext==='docx'?await loadDocx(ab,file.name):await loadPdf(ab,file.name);
    await setDocStage('identifying');
    const H=heurExtract(S.src);
    await setDocStage('extracting');
    let ai=null,mode='extracción por estructura';
    try{
      await setDocStage('pricing','Leyendo cláusulas, tablas y Anexo A con IA.');
      ai=await aiExtract(S.src);
      mode=S.src.kind==='pdf'?'extracción IA (PDF)':'extracción estructura + IA';
    }catch(e){
      mode='extracción por estructura (IA no disponible: '+e.message+')';
    }
    await setDocStage('annex');
    S.extractMode=mode;
    initFromExt(normalizeExt(mergeExt(H,ai)));
    const b=leerBorrador();
    if(b&&b.archivo===S.docFileName&&b.ext){
      await setDocStage('validating','Recuperando la renovación guardada de este acuerdo…');
      aplicarBorrador(b);
    }
    await setDocStage('validating');
    DOC_TIMERS.forEach(clearTimeout);
    S.docStatus='success';S.docStage=DOC_ETAPAS.success;
    S.docDetalle='Encontramos la información del cliente, vigencia, productos y condiciones comerciales. Revisa los datos antes de continuar.';
    say('');render();
  }catch(e){
    console.error(e);
    DOC_TIMERS.forEach(clearTimeout);
    const nombre=S.docFileName,archivo=S.docFile;
    S=blankState();
    S.docStatus='error';S.docStage=DOC_ETAPAS.error;
    S.docDetalle=e.message||'No fue posible leer el archivo.';
    S.docFileName=nombre;S.docFile=archivo;
    say('');render();
  }
}
async function reintentarDocumento(){
  const f=S.docFile;
  if(!f){S=blankState();render();return;}
  S.docStatus='idle';
  await handleFile(f);
}

   PASO 7 — RESUMEN Y COMPARATIVO
   ========================================================================= */
function cmpRows(){
  const R=[],E=S.ext;
  const add=(campo,ant,nue)=>{
    const a=ant==null?'':String(ant),n=nue==null?'':String(nue);
    R.push({campo,ant:a,nue:n,st:a===n?'same':(a?'mod':'new')});
  };
  add('Razón social',E.emp.razon,S.emp.razon);
  add('RFC / Tax ID',E.emp.taxid,S.emp.taxid);
  add('Inicio de vigencia',dEs(S.ren.prevInicio),dEs(S.ren.inicio));
  add('Próxima renovación',dEs(S.ren.prevRenov),dEs(S.ren.renov));
  add('Duración',(E.vig.meses||12)+' meses',S.ren.meses+' meses');
  add('Responsable del proyecto',E.per.responsable.nombre,S.per.responsable.nombre);
  add('Contacto de facturación',E.per.factura.nombre,S.per.factura.nombre);
  add('Firmante del cliente',E.per.firmaCliente.nombre,S.per.firmaCliente.nombre);
  add('Firmante Lapzo',E.per.firmaLapzo.nombre,S.per.firmaLapzo.nombre);
  S.prods.forEach(p=>{
    const nm=(p.cur.nombre||p.base.nombre||'').slice(0,40);
    if(p.action==='del'){R.push({campo:'Producto · '+nm,ant:money(p.base.final),nue:'eliminado',st:'del'});return;}
    const c=chainOf(p);
    const valNue=esPagado(p.cur)?money(c.fin):pricingLabel(p.cur);
    const valAnt=esPagado(p.base)?money(p.base.final):(pricingLabel(p.base)||PRICING[p.base.pricing||'unknown'].l);
    if(p.isNew){R.push({campo:'Producto · '+nm,ant:'—',nue:valNue,st:'new'});return;}
    R.push({campo:'Producto · '+nm,ant:valAnt,nue:valNue,st:valAnt===valNue?'same':'mod'});
    if((p.base.licenciasRaw||'')!==(p.cur.licenciasRaw||''))
      R.push({campo:'Licencias · '+nm,ant:p.base.licenciasRaw||'—',nue:p.cur.licenciasRaw||'—',st:'mod'});
    if((p.base.colaboradores||'')!==(p.cur.colaboradores||''))
      R.push({campo:'Colaboradores · '+nm,ant:p.base.colaboradores||'—',nue:p.cur.colaboradores||'—',st:'mod'});
  });
  add('Duración de la vigencia',(E.vig.mesesRaw||'—'),(S.ren.meses||DURACION_ESTANDAR)+' meses'+(S.ren.mesesSource==='user'?' (definida por ti)':''));
  add('Fin de vigencia',dEs(S.ren.prevRenov),dEs(S.ren.renov));
  add('Valor total sin IVA',money(totalAnterior()),money(totalNuevo()));
  add('Parcialidades',String(E.pagos?E.pagos.length:(E.cond&&E.cond.pagos?E.cond.pagos.length:S.pay.n)),String(S.pay.n));
  add('Días de crédito',String(E.cond.dias||'—'),String(S.pay.dias||'—'));
  add('Logo web / ventas',E.logo.web==null?'—':(E.logo.web?'SÍ':'NO'),S.logo.web?'SÍ':'NO');
  add('Logo redes sociales',E.logo.redes==null?'—':(E.logo.redes?'SÍ':'NO'),S.logo.redes?'SÍ':'NO');
  add('Colaboradores',S.colab.ant||'—',(S.colab.mode==='keep'?S.colab.ant:S.colab.nue)||'—');
  // correcciones hechas sobre lo leído del acuerdo (original del PDF → dato actual)
  if(S.original){
    const O=S.original;
    [['Razón social',O.emp.razon,S.ext.emp.razon],
     ['RFC / Tax ID',O.emp.taxid,S.ext.emp.taxid],
     ['Domicilio',O.emp.domicilio,S.ext.emp.domicilio],
     ['Responsable (acuerdo anterior)',O.per.responsable.nombre,S.ext.per.responsable.nombre],
     ['Firmante del cliente',O.per.firmaCliente.nombre,S.ext.per.firmaCliente.nombre]
    ].forEach(([l,a,b])=>{if(String(a||'')!==String(b||''))add('Corregido · '+l,a||'—',b||'—');});
    (O.prods||[]).forEach((p,i)=>{
      const n=(S.ext.prods||[])[i];if(!n)return;
      if(String(p.licenciasRaw||'')!==String(n.licenciasRaw||''))add('Corregido · licencias '+(n.nombre||'').slice(0,20),p.licenciasRaw||'—',n.licenciasRaw||'—');
    });
  }
  return R;
}

/* =========================================================================
   ACCIONES
   ========================================================================= */
function actions(a,arg,el){
  const two=String(arg||'').split('|');
  if(['build','pdf','docx','anexoPng','issueOk','issueFix','retryDoc','pick','reiniciarRen'].indexOf(a)<0)tocarEstado();
  switch(a){
    case 'go':{const n=+arg;if(!stepBlocked(n))goto(n);break;}
    case 'pick':if(!docTrabajando())$('#fileIn').click();break;
    case 'retryDoc':reintentarDocumento();break;
    case 'reiniciarRen':{
      if(!confirm('Se borrarán todos los datos de esta renovación (productos, inflación, personas y decisiones). ¿Continuar?'))break;
      borrarBorrador();S=blankState();PID=0;PIDSEQ=0;render();break;
    }
    case 'reAi':(async()=>{
      try{say('Re-extrayendo con IA…',true);
        const ai=await aiExtract(S.src);
        S.extractMode='re-extracción IA';
        S.ext=normalizeExt(mergeExt(heurExtract(S.src),ai));
        recomputeFromExt();say('');render();
      }catch(e){say('');alert('No se pudo re-extraer: '+e.message);}
    })();break;
    case 'issue':{
      const iss=S.issues.find(i=>i.id===two[0]);
      if(iss){iss.choice=two.slice(1).join('|');applyIssue(iss);}
      render();break;
    }
    case 'issueOtro':{
      const iss=S.issues.find(i=>i.id===arg);
      if(iss){iss.custom=el.value;applyIssue(iss);}
      refreshLive();break;
    }
    case 'ini':{
      const d=parseDate(el.value);
      if(d){S.ren.inicio=d;S.ren.renov=addMonths(d,S.ren.meses);recalcPagos(true);S.anexo.data.anioAuto=true;syncAnexo();render();}
      break;
    }
    case 'envio':{
      const d=parseDate(el.value);
      if(d){S.envio=d;S.anexo.data.vigenciaAuto=true;syncAnexo();render();}
      break;
    }
    case 'anioAnexo':{
      const y=parseInt(el.value,10);
      if(y>1990&&y<2200){S.anexo.data.anio=y;S.anexo.data.anioAuto=false;render();}
      break;
    }
    case 'meses':{
      const m=Math.max(1,parseInt(el.value,10)||DURACION_ESTANDAR);
      if(m!==S.ren.meses)S.ren.mesesSource='user';
      S.ren.meses=m;if(S.ren.inicio)S.ren.renov=addMonths(S.ren.inicio,m);
      syncAnexo();
      break;
    }
    case 'per':{
      S.perKeep[two[0]]=two[1]==='keep';
      if(two[1]==='keep')S.per[two[0]]=JSON.parse(JSON.stringify(S.ext.per[two[0]]));
      render();break;
    }
    case 'pactRegalo':{
      const p=S.prods.find(x=>String(x.id)===String(two[0]));
      if(p&&esRegalo(p)){
        if(two[1]==='nombre')p.cur.nombre=el?el.value:p.cur.nombre;
        syncRegalosTaaS();syncAnexo();
      }
      break;
    }
    case 'pact':{
      const p=S.prods.find(x=>String(x.id)===String(two[0]));
      if(p){p.action=two[1];if(two[1]==='keep'){p.cur=JSON.parse(JSON.stringify(p.base));p.priceEdited=false;p.applyInfl=true;}}
      syncRegalosTaaS();syncAnexo();recalcPagos(S.pay.mode==='keep');render();break;
    }
    case 'pricingSet':{
      const p=S.prods.find(x=>String(x.id)===String(arg));
      if(p){
        if(esPagado(p.cur)){
          p.cur.pricingLabel='';
          if(p.cur.lista==null)p.cur.lista=p.base.lista!=null?p.base.lista:null;
        }else{
          if(!p.cur.pricingLabel)p.cur.pricingLabel=PRICING[p.cur.pricing].l;
          p.cur.descVal=0;                       // un obsequio no es un descuento
        }
      }
      recalcPagos(S.pay.mode==='keep');render();break;
    }
    case 'listaEdit':{
      const p=S.prods.find(x=>String(x.id)===String(arg));
      if(p){p.cur.listaPubManual=true;}          // se respeta el valor capturado
      recalcPagos(S.pay.mode==='keep');refreshLive();break;
    }
    case 'listaAuto':{
      const p=S.prods.find(x=>String(x.id)===String(arg));
      if(p){p.cur.listaPubManual=false;p.cur.listaPub=null;}
      render();break;
    }
    case 'priceEdit':{
      const p=S.prods.find(x=>String(x.id)===String(arg));
      if(p&&!p.isNew){p.priceEdited=(p.cur.lista!==p.base.lista);if(!p.priceEdited)p.applyInfl=true;}
      recalcPagos(S.pay.mode==='keep');break;
    }
    case 'desc':{
      const p=S.prods.find(x=>String(x.id)===String(two[0]));
      if(p){
        if(two[1]==='keep'){p.cur.descTipo=p.base.descTipo;p.cur.descVal=p.base.descVal;}
        if(two[1]==='rm'){p.cur.descVal=0;}
        if(two[1]==='chg'&&!p.cur.descVal)p.cur.descVal=p.base.descVal||10;
      }
      recalcPagos(S.pay.mode==='keep');render();break;
    }
    case 'addCat':{
      const it=CATALOGO_PRODUCTOS.find(x=>x.k===arg);
      if(!it)break;
      if(it.k==='taas'){actions('addTaaS');break;}
      if(it.k==='blank'){actions('addProd');break;}
      const yaEsta=(S.prods||[]).some(p=>p.action!=='del'&&normN(p.cur.nombre)===normN(it.n));
      if(yaEsta){render();break;}
      const esGP=it.k==='gp';
      const base={pricing:esGP?'gift':'priced',pricingLabel:esGP?'Incluido / Regalo':'',
        nombre:it.n,plan:'',descripcion:'',notas:'',modulos:[],
        licenciasRaw:'',colaboradores:'',plazoRaw:DURACION_ESTANDAR+' meses',
        lista:null,listaRaw:'',final:null,finalRaw:'',descTipo:'pct',descVal:0,priceType:'FINAL_CONTRACTED'};
      S.prods.push({id:nextProdId(it.k),tipo:it.tipo,isNew:true,action:'mod',
        applyInfl:false,priceEdited:true,
        base:JSON.parse(JSON.stringify(base)),
        cur:Object.assign(JSON.parse(JSON.stringify(base)),{listaPub:null,listaPubManual:false,
          giftEstado:esGP?it.estado:''})});
      syncRegalosTaaS();syncAnexo();recalcPagos(S.pay.mode==='keep');render();break;
    }
    case 'addTaaS':{
      if(hayTaaS()){render();break;}
      const base={pricing:'priced',pricingLabel:'',nombre:'Talent as a Service (TaaS)',plan:'',descripcion:'',
        modulos:ANEXO_TAAS.slice(),licenciasRaw:'',colaboradores:'',plazoRaw:DURACION_ESTANDAR+' meses',
        lista:null,listaRaw:'',final:null,finalRaw:'',descTipo:'pct',descVal:0,priceType:'FINAL_CONTRACTED',notas:''};
      S.prods.push({id:nextProdId('taas'),tipo:'TAAS',isNew:true,action:'mod',applyInfl:true,priceEdited:true,taasStd:true,
        base:JSON.parse(JSON.stringify(base)),
        cur:Object.assign(JSON.parse(JSON.stringify(base)),{listaPub:null,listaPubManual:false})});
      syncRegalosTaaS();syncAnexo();recalcPagos(S.pay.mode==='keep');render();break;
    }
    case 'addBolt':{
      if(boltContratado()){render();break;}
      const base={pricing:'priced',pricingLabel:'',nombre:'Cursos Bolt',plan:'',descripcion:'',
        modulos:[],licenciasRaw:'',colaboradores:'',plazoRaw:DURACION_ESTANDAR+' meses',
        lista:null,listaRaw:'',final:null,finalRaw:'',descTipo:'pct',descVal:0};
      S.prods.push({id:nextProdId('bolt'),tipo:'BOLT',isNew:true,action:'mod',applyInfl:true,priceEdited:true,
        base:JSON.parse(JSON.stringify(base)),
        cur:Object.assign(JSON.parse(JSON.stringify(base)),{listaPub:null,listaPubManual:false})});
      syncRegalosTaaS();syncAnexo();recalcPagos(S.pay.mode==='keep');render();break;
    }
    case 'addProd':{
      S.prods.push({id:nextProdId('nuevo'),tipo:'NUEVO',isNew:true,action:'mod',applyInfl:false,priceEdited:true,
        base:{nombre:'',plan:'',descripcion:'',notas:'',modulos:[],licenciasRaw:'',colaboradores:'',plazoRaw:'',lista:null,listaRaw:'',final:null,finalRaw:'',descTipo:'pct',descVal:0,priceType:'FINAL_CONTRACTED'},
        cur:{nombre:'',plan:'',descripcion:'',notas:'',modulos:[],licenciasRaw:'',colaboradores:'',plazoRaw:S.ren.meses+' meses',lista:null,listaRaw:'',descTipo:'pct',descVal:0,priceType:'FINAL_CONTRACTED',listaPub:null,listaPubManual:false}});
      render();break;
    }
    case 'revisado':{
      const p=S.prods.find(x=>String(x.id)===String(arg));
      if(p)p.revisar='';
      render();break;
    }
    case 'rmProd':S.prods=S.prods.filter(x=>String(x.id)!==String(arg));syncRegalosTaaS();recalcPagos(S.pay.mode==='keep');render();break;
    case 'addMod':{
      const inp=$('#modIn'+arg),p=S.prods.find(x=>String(x.id)===String(arg));
      if(p&&inp&&inp.value.trim()){p.cur.modulos=(p.cur.modulos||[]).concat([inp.value.trim()]);render();}
      break;
    }
    case 'rmMod':{
      const p=S.prods.find(x=>String(x.id)===String(two[0]));
      if(p)p.cur.modulos.splice(+two[1],1);
      render();break;
    }
    case 'payMode':S.pay.mode=two[0]==='keep'?'keep':'chg';if(S.pay.mode==='keep'){S.pay.n=S.pay.prevPagos.length||1;S.pay.dias=S.ext.cond.dias||30;S.pay.auto=true;recalcPagos(true);}render();break;
    case 'payN':{S.pay.n=Math.max(1,Math.min(24,parseInt(el.value,10)||1));recalcPagos(false);render();break;}
    case 'payAuto':S.pay.auto=arg==='1';if(S.pay.auto)recalcPagos(false);render();break;
    case 'payDate':{const d=parseDate(el.value),pg=S.pay.pagos[+arg];
      if(d&&pg){pg.fecha=d;pg.fechaRaw=dEs(d);pg.fechaManual=true;S.pay.auto=false;refreshLive();}break;}
    case 'payAmt':{const v=parseNum(el.value),pg=S.pay.pagos[+arg];
      if(pg){pg.monto=v==null?0:round2(v);pg.valorManual=true;S.pay.auto=false;refreshLive();}break;}
    case 'planSel':{
      const nuevo=el.value;
      if(nuevo===S.pay.plan){render();break;}
      if(!confirm('El cambio de plan generará un nuevo calendario de facturación.\n\n¿Aplicar el plan '+(PLANES[nuevo]?PLANES[nuevo].l:nuevo)+'?')){render();break;}
      generarPagos(nuevo,nuevo==='PERSONALIZADO'?S.pay.n:0);syncAnexo();render();break;}
    case 'planReset':{
      if(!confirm('Se recalcularán número de pagos, fechas y montos con el plan '+(PLANES[S.pay.plan]?PLANES[S.pay.plan].l:S.pay.plan)+'. ¿Continuar?'))break;
      generarPagos(S.pay.plan||'ANUAL',S.pay.n);syncAnexo();render();break;
    }
    case 'payFechasUpd':{
      fechasDePlan(S.pay.plan||'ANUAL',(S.pay.pagos||[]).length).forEach((f,k)=>{
        const pg=S.pay.pagos[k];if(pg){pg.fecha=f;pg.fechaRaw=dEs(f);pg.fechaManual=false;}});
      S.pay.iniRef=S.ren.inicio?dISO(S.ren.inicio):'';S.pay.avisoFecha=false;render();break;
    }
    case 'payFechasKeep':{S.pay.avisoFecha=false;S.pay.iniRef=S.ren.inicio?dISO(S.ren.inicio):'';render();break;}
    case 'payRedistribuir':{(S.pay.pagos||[]).forEach(p=>{p.valorManual=false;});recalcPagos(false);S.pay.avisoTotal=null;render();break;}
    case 'payManual':{S.pay.avisoTotal=null;render();break;}
    case 'esquemaManual':S.anexo.data.esquemaManual=true;break;
    case 'fixPay':{
      const n=S.pay.pagos.length;if(!n)break;
      const others=S.pay.pagos.slice(0,n-1).reduce((x,p)=>x+(p.monto||0),0);
      S.pay.pagos[n-1].monto=round2(totalNuevo()-others);render();break;
    }
    case 'logoMode':S.logo.changed=arg==='chg';if(!S.logo.changed){S.logo.web=S.ext.logo.web;S.logo.redes=S.ext.logo.redes;}render();break;
    case 'showAll':S.showAll=!S.showAll;render();break;
    case 'anexoMode':S.anexo.mode=arg;render();break;
    case 'anexoImg':$('#anexoFile').click();break;
    case 'consStd':S.anexo.data.consideraciones=CONSIDERACIONES_STD.slice();render();break;
    case 'addCons':{const i=$('#consIn');if(i&&i.value.trim()){S.anexo.data.consideraciones.push(i.value.trim());render();}break;}
    case 'rmCons':S.anexo.data.consideraciones.splice(+arg,1);render();break;
    case 'anxFix':{
      const inc=anexoInconsistencias().find(x=>x.id===two[0]);
      if(inc){
        if(two[1]==='ok')S.anexoOk[inc.id]=true;
        else if(inc.id==='colab'){const f=S.anexo.data.filas.find(x=>/colaborador/.test(normN(x.nombre)));if(f)f.nue=(S.colab.mode==='keep'?S.colab.ant:S.colab.nue)||'';}
        else if(inc.fila!=null&&S.anexo.data.filas[inc.fila])S.anexo.data.filas[inc.fila].nue='No';
      }
      render();break;
    }
    case 'blk':{
      const k=two[0];
      if(two[1]==='keep'){
        if(blkDirty(k)&&!confirm('Tienes cambios sin guardar en este bloque. ¿Descartarlos y marcarlo como «Mantener»?'))break;
        blkConfirmar(k);
      }else blkEditar(k);
      render();break;
    }
    case 'blkSave':blkGuardar(two[0]);render();break;
    case 'blkCancel':{
      if(blkDirty(two[0])&&!confirm('Se descartarán los cambios no guardados de este bloque. ¿Continuar?'))break;
      blkCancelar(two[0]);render();break;
    }
    case 'confAll':Object.keys(BLOQUES).forEach(k=>{if(blkStatus(k)==='pending')blkConfirmar(k);});render();break;
    case 'issueFix':goToField(two[0],two.slice(1).join('|'));break;
    case 'irProductos':S.step=6;S.maxStep=Math.max(S.maxStep||1,6);render();break;
    case 'issueOk':S.okIssues[arg]=true;render();break;
    case 'vigOk':S.vigOk=!S.vigOk;render();break;
    case 'logoPick':$('#logoFile').click();break;
    case 'rerender':render();break;
    case 'giftSync':syncRegalosTaaS();syncAnexo();refreshLive();break;
    case 'finVig':{
      const d=blkOf('cond').draft;const out=$('#fld-cond-finVig');
      if(d&&out){
        const ini=parseDate(d.renewalInicio)||S.ren.inicio;
        const m=Math.max(1,parseInt(d.renewalMeses,10)||DURACION_ESTANDAR);
        out.value=dEs(addMonths(ini,m));      // se recalcula en vivo sin cerrar el bloque
      }
      break;
    }
    case 'logoQuitar':S.logoCli={url:null,name:'',mime:'',w:0,h:0,omitir:S.logoCli.omitir,error:''};render();break;
    case 'colab':S.colab.mode=arg;S.colab.tocado=true;if(arg==='keep')S.colab.nue=S.colab.ant;syncAnexo();render();break;
    case 'syncAnexo':syncAnexo();break;
    case 'addAnxFila':{
      const n=$('#anxN'),a=$('#anxA'),v=$('#anxV');
      if(n&&n.value.trim()){S.anexo.data.filas.push({nombre:n.value.trim(),ant:(a?a.value.trim():'')||'No',nue:(v?v.value.trim():'')||'Sí'});render();}
      break;}
    case 'rmAnxFila':S.anexo.data.filas.splice(+arg,1);render();break;
    case 'addAnxMod':{
      const n=$('#anxN'),v=$('#anxV');
      if(n&&n.value.trim()){S.anexo.data.modulos.push({nombre:n.value.trim(),valor:(v?v.value.trim():'')||'Incluido'});render();}
      break;
    }
    case 'rmAnxMod':S.anexo.data.modulos.splice(+arg,1);render();break;
    case 'addManual':{
      const f=$('#mFrom'),t=$('#mTo');
      if(f&&f.value){S.manual.push({from:f.value,to:t?t.value:''});render();}
      break;
    }
    case 'rmManual':S.manual.splice(+arg,1);render();break;
    case 'build':doBuild();break;
    case 'pdf':doPdf();break;
    case 'docx':doDocx();break;
    case 'anexoPng':doAnexoPng();break;
  }
}

   GENERACIÓN — reemplazos en dos fases (evita cascadas)

const TOK=i=>'\u0001R'+i+'\u0001';
function applyEditsSafe(root,edits,skip){
  const list=edits.filter(e=>e&&e.from&&e.to!=null&&String(e.from)!==String(e.to));
  if(!list.length)return [];
  const ph=list.map((e,i)=>({from:e.from,to:TOK(i),label:e.label}));
  const hit=applyEdits(root,ph,skip);
  const back=list.map((e,i)=>({from:TOK(i),to:String(e.to),label:e.label}));
  applyEdits(root,back,null);
  return hit.map(h=>{
    const m=String(h.to).match(/\u0001R(\d+)\u0001/);
    const i=m?+m[1]:-1;
    return i>=0?{from:list[i].from,to:list[i].to,label:list[i].label||''}:h;
  });
}
function moneyLike(ref,n){return fmtLikeMoney(ref||S.ext.cond.totalRaw||'$0',n);}

function findTable(doc,test){
  for(const b of bodyBlocks(doc)){
    if(b.localName!=='tbl')continue;
    const rows=tblRows(b);
    if(!rows.length)continue;
    const head=rowCells(rows[0]).map(cellText).map(norm);
    if(test(head,rows,b))return b;
  }
  return null;
}

      (m,si,mid,no)=>'( '+(val?'x':' ')+' ) '+si+mid+'( '+(val?' ':'x')+' ) '+no);
    if(nuevo!==t){setParaText(p,nuevo);report.push('Derechos de logo ('+(isWeb?'web/ventas':'redes')+'): '+(val?'SÍ':'NO'));}

}
function clearStrike(tc){

function rebuildProductTable(doc,report,skip){
  const tbl=findTable(doc,h=>h.some(x=>/producto/.test(x))&&h.some(x=>/valor|precio/.test(x)));
  if(!tbl){report.push('⚠️ No se localizó la tabla de productos en la plantilla: revisa los importes manualmente.');return null;}
  const rows=tblRows(tbl);
  const head=rowCells(rows[0]).map(cellText).map(norm);
  const idx=re=>head.findIndex(x=>re.test(x));
  const cN=Math.max(0,idx(/producto/)),cP=idx(/plazo/),cL=idx(/licencia|cantidad/),cV=idx(/valor|precio/);
  const dataRows=rows.slice(1);
  const template=dataRows[0]||null;
  const refMoney=(S.prods.find(p=>!p.isNew&&p.base.finalRaw)||{base:{}}).base.finalRaw
    ||(S.prods.find(p=>!p.isNew&&p.base.listaRaw)||{base:{}}).base.listaRaw||S.ext.cond.totalRaw;
  const usados=[];
  S.prods.forEach((p,i)=>{
    if(p.isNew)return;
    const tr=dataRows[i];
    if(!tr)return;
    usados.push(tr);
    if(p.action==='del'){tbl.removeChild(tr);report.push('Producto eliminado de la tabla: '+p.base.nombre);return;}
    const cells=rowCells(tr),c=chainOf(p);
    // importes en su lugar (conserva tachados y formato de la celda)
    if(cV>=0&&cells[cV]&&!esPagado(p.cur)){
      // obsequio / incluido / bonificado: se conserva (o corrige) el texto, nunca se pone $0
      const literal=pricingLabel(p.cur);
      const actual=cellText(cells[cV]).replace(/\s+/g,' ').trim();
      if(literal&&norm(actual)!==norm(literal))setCellText(cells[cV],literal);
      clearStrike(cells[cV]);        // sin tachados heredados de un precio anterior
      report.push('«'+(p.cur.nombre||'').slice(0,32)+'»: se conserva la condición «'+literal+'» sin importe ni inflación.');
    }else if(cV>=0&&cells[cV]){
      const cell=cells[cV];
      const amounts=(cellText(cell).match(/\$?\s?[\d][\d.,]*/g)||[]).map(s=>s.trim()).filter(s=>parseNum(s)!=null&&parseNum(s)>0);
      const ed=[];
      if(amounts.length>=2){
        ed.push({from:amounts[0],to:moneyLike(amounts[0],c.listaPub)});
        ed.push({from:amounts[amounts.length-1],to:moneyLike(amounts[amounts.length-1],c.fin)});
      }else if(amounts.length===1){
        ed.push({from:amounts[0],to:moneyLike(amounts[0],c.fin)});
        report.push('«'+(p.cur.nombre||'').slice(0,32)+'»: la celda del acuerdo sólo muestra un importe, así que lleva el precio final '+money(c.fin)+'. El precio lista sugerido ('+money(c.listaPub)+') se presenta en el Anexo A.');
      }else{setCellText(cell,moneyLike('',c.fin));}
      if(ed.length)applyEditsSafe(cell,ed);
    }
    const put=(ci,oldV,newV,etiqueta)=>{
      if(ci<0||!cells[ci])return;
      const o=String(oldV||'').trim(),n=String(newV||'').trim();
      if(!n||o===n)return;
      const hit=o?applyEditsSafe(cells[ci],[{from:o,to:n}]):[];
      if(!hit.length&&norm(cellText(cells[ci])).indexOf(norm(n))<0){
        setCellText(cells[ci],n);
        if(etiqueta)report.push('⚠️ «'+etiqueta+'»: la celda se reescribió en una sola línea porque el texto anterior estaba repartido en varios párrafos. Revisa negritas y notas al pie de esa celda.');
      }
    };
    put(cL,p.base.licenciasRaw,p.cur.licenciasRaw);
    put(cP,p.base.plazoRaw,p.cur.plazoRaw);
    if(p.action==='mod'&&p.base.nombre&&p.cur.nombre&&p.base.nombre!==p.cur.nombre)
      put(cN,p.base.nombre,p.cur.nombre,'Producto: '+String(p.cur.nombre).slice(0,28));
    if(p.action==='mod')report.push('Producto modificado: '+p.cur.nombre+' → '+money(c.fin));
  });
  // productos nuevos: se clona la primera fila de datos para heredar el formato
  const nuevos=S.prods.filter(p=>p.isNew);
  if(nuevos.length&&template){
    nuevos.forEach(p=>{
      const c=chainOf(p),tr=template.cloneNode(true);
      const cells=rowCells(tr);
      const set=(ci,v)=>{if(ci>=0&&cells[ci])setCellText(cells[ci],v);};
      set(cN,esRegalo(p)?regaloTitulo(p):((p.cur.nombre||'')+(p.cur.plan?' ('+p.cur.plan+')':'')));
      set(cP,p.cur.plazoRaw||String(S.ren.meses));
      set(cL,p.cur.licenciasRaw||'-');
      set(cV,esPagado(p.cur)?moneyLike(refMoney,c.fin):pricingLabel(p.cur));
      cells.forEach(clearStrike);
      tbl.appendChild(tr);
      report.push('Producto agregado a la tabla: '+(p.cur.nombre||'(sin nombre)')+' → '+money(c.fin));
    });
  }else if(nuevos.length){
    report.push('⚠️ No se pudo clonar una fila de producto: los productos nuevos no se insertaron en la tabla.');
  }
  tblRows(tbl).forEach(tr=>tagsOf(tr,'p').forEach(p=>skip.add(p)));
  return tbl;
}
function rebuildPaymentTable(doc,report,skip){
  const tbl=findTable(doc,h=>h.some(x=>/fecha/.test(x))&&h.some(x=>/valor|monto|importe/.test(x)));
  if(!tbl){report.push('⚠️ No se localizó la tabla del plan de pagos: revísala manualmente.');return null;}

  return tbl;
}
function textEdits(){
  const E=S.ext,ed=[];
  const push=(from,to,label)=>{if(from&&to!=null&&String(from)!==String(to))ed.push({from:String(from),to:String(to),label});};
  // vigencia
  if(E.vig.inicioRaw&&S.ren.inicio)push(E.vig.inicioRaw,fmtLikeDate(E.vig.inicioRaw,S.ren.inicio),'Inicio de contrato');
  if(E.vig.renovRaw&&S.ren.renov)push(E.vig.renovRaw,fmtLikeDate(E.vig.renovRaw,S.ren.renov),'Renovación');
  if(E.vig.mesesRaw&&(E.vig.meses||12)!==S.ren.meses)
    push(E.vig.mesesRaw,E.vig.mesesRaw.replace(/\d+/,String(S.ren.meses)),'Duración');
  // total
  if(E.cond.totalRaw)push(E.cond.totalRaw,moneyLike(E.cond.totalRaw,totalNuevo()),'Valor total del servicio');
  // días de crédito
  if(E.cond.diasRaw&&E.cond.dias&&S.pay.dias&&+E.cond.dias!==+S.pay.dias)
    push(E.cond.diasRaw,E.cond.diasRaw.replace(/\d+/,String(S.pay.dias)),'Días de crédito');
  // personas
  const F={responsable:['nombre','cargo','tel','email'],factura:['nombre','cargo','tel','email'],
           firmaCliente:['nombre','cargo','id','empresa']};
  Object.keys(F).forEach(k=>{
    if(S.perKeep[k])return;
    F[k].forEach(f=>{push(E.per[k][f],S.per[k][f],'Persona · '+k+'.'+f);});
  });
  // firmante Lapzo / DECASOL: dato fijo, siempre se impone sobre lo que traiga el acuerdo anterior
  ['nombre','cargo','id'].forEach(f=>push(E.per.firmaLapzo[f],LAPZO_FIRMA[f],'Firmante Lapzo · '+f));
  // título del anexo: propuesta económica
  const anexoTit=(S.src.text||'').match(/ANEXO\s+A\.?\s+PROPUESTA(?!\s+ECON)/i);
  if(anexoTit)push(anexoTit[0],anexoTit[0].replace(/PROPUESTA/i,'PROPUESTA ECONÓMICA'),'Título del Anexo A');
  // reemplazos manuales del usuario
  S.manual.forEach(m=>push(m.from,m.to,'Reemplazo manual'));
  return ed;
}
function residues(txt,report,nuevos){
  const out=[],seen={};
  const NEW=nuevos||[];
  const chk=(v,label)=>{
    if(!v)return;
    const s=String(v).trim();
    if(!s||s.length<4||seen[s])return;
    seen[s]=1;
    if(NEW.some(n=>String(n).indexOf(s)>=0))return;
    if(txt.indexOf(s)>=0)out.push(label+': «'+s+'»');
  };
  const E=S.ext;
  if(S.ren.inicio&&E.vig.inicioRaw&&fmtLikeDate(E.vig.inicioRaw,S.ren.inicio)!==E.vig.inicioRaw)chk(E.vig.inicioRaw,'Fecha de inicio anterior');
  if(S.ren.renov&&E.vig.renovRaw&&fmtLikeDate(E.vig.renovRaw,S.ren.renov)!==E.vig.renovRaw)chk(E.vig.renovRaw,'Fecha de renovación anterior');
  if(E.cond.totalRaw&&Math.abs((E.cond.total||0)-totalNuevo())>0.5)chk(E.cond.totalRaw,'Valor total anterior');
  S.prods.forEach(p=>{
    const c=p.action==='del'?null:chainOf(p);
    if(p.isNew)return;
    if(p.action==='del')return;   // su mención en el texto contractual histórico es legítima
    if(!esPagado(p.cur))return;
    if(c&&Math.abs((p.base.final||0)-c.fin)>0.5)chk(p.base.finalRaw,'Precio final anterior de '+p.base.nombre.slice(0,24));
    if(c&&Math.abs((p.base.lista||0)-c.act)>0.5)chk(p.base.listaRaw,'Precio lista anterior de '+p.base.nombre.slice(0,24));
  });
  Object.keys(S.perKeep).forEach(k=>{
    if(S.perKeep[k])return;
    ['nombre','email','tel','id'].forEach(f=>{
      const o=S.ext.per[k][f],n=S.per[k][f];
      if(o&&n&&o!==n)chk(o,'Dato anterior de '+k);
    });
  });
  (S.ext.cond.pagos||[]).forEach(p=>{
    const still=S.pay.pagos.some(q=>fmtLikeDate(p.fechaRaw,q.fecha)===p.fechaRaw);
    if(!still)chk(p.fechaRaw,'Fecha de pago anterior');
  });
  return out;
}

/* ---------- las firmas anteriores nunca se heredan ---------- */
function limpiarZonaFirmas(doc,report){
  const blocks=bodyBlocks(doc);
  let zona=false,imgs=0,fechas=0;
  blocks.forEach(b=>{
    const t=(b.localName==='p'?nodeText(b):nodeText(b)).replace(/\s+/g,' ').trim();
    if(RE_ZONA_FIRMA.test(t)){zona=true;return;}
    if(zona&&RE_FIN_ZONA.test(t)){zona=false;}
    if(!zona)return;
    ['drawing','pict','object','AlternateContent'].forEach(tag=>{
      tagsOf(b,tag).forEach(el=>{if(el.parentNode){el.parentNode.removeChild(el);imgs++;}});
    });
    if(/^(fecha|firmado el|fecha de firma)\s*:?/i.test(t)||
       (/^\d{1,2}\s*[\/\-.]\s*\w+\s*[\/\-.]\s*\d{2,4}$/.test(t)&&!RE_ETIQ_FIRMA.test(t))){
      if(b.localName==='p'){setParaText(b,'');fechas++;}
    }
  });
  if(imgs)report.push('Zona de firmas: se eliminaron '+imgs+' elemento(s) gráfico(s) del acuerdo anterior (firmas o rúbricas). El nuevo acuerdo sale sin firmar.');
  if(fechas)report.push('Zona de firmas: se limpiaron '+fechas+' fecha(s) de firma del acuerdo anterior.');
  return {imgs,fechas};
}

function validateSignatureArea(gen){
  const g=gen||S.gen;
  const out=[];
  if(!g)return out;
  if(g.xml){
    try{
      const doc=parseXml(g.xml);
      let zona=false;
      bodyBlocks(doc).forEach(b=>{
        const t=nodeText(b).replace(/\s+/g,' ').trim();
        if(RE_ZONA_FIRMA.test(t)){zona=true;return;}
        if(zona&&RE_FIN_ZONA.test(t))zona=false;
        if(!zona)return;
        ['drawing','pict','object'].forEach(tag=>{
          if(tagsOf(b,tag).length)out.push('Hay una imagen dentro de la zona de firmas (posible firma o rúbrica heredada).');
        });
        if(/^(fecha|firmado el)\s*:?\s*\S/i.test(t))out.push('Hay una fecha de firma heredada en la zona de firmas: «'+t.slice(0,40)+'».');
      });
    }catch(e){out.push('No fue posible validar la zona de firmas del DOCX.');}
  }
  if(g.html){
    const h=g.html;
    const i=h.search(/FIRMA\s+DEL\s+(REPRESENTANTE|APODERADO)/i);
    if(i>=0){
      const cola=h.slice(i);
      const fin=cola.search(/ANEXO\s+A/i);
      const zona=fin>0?cola.slice(0,fin):cola;
      if(/<img|data:image|<svg/i.test(zona))out.push('La vista previa incluye una imagen en la zona de firmas: debe reconstruirse limpia.');
    }
  }
  return Array.from(new Set(out));
}
/* ---------- logo del cliente: se ajusta a la caja original sin deformarlo ---------- */
function logoDestino(){
  const hs=(S.src&&S.src.headerImgs||[]).slice();
  if(!hs.length)return null;
  // la imagen del cliente es la de la izquierda (menor desplazamiento horizontal)
  hs.sort((a,b)=>(a.x||0)-(b.x||0));

async function logoAjustado(destino){
  const L=S.logoCli;
  if(!L||!L.url||L.omitir||!destino)return null;
  const im=await loadImg(L.url);
  if(!im)return null;
  // la caja se toma del tamaño real de la imagen que se sustituye: Word conserva ese marco,
  // así el logo nuevo entra "contain" y no se deforma
  const orig=await loadImg(destino.url);
  let boxW=(orig&&orig.naturalWidth)||destino.pxW||300,boxH=(orig&&orig.naturalHeight)||destino.pxH||140;
  const cap=Math.min(1,1200/Math.max(boxW,boxH));
  boxW=Math.max(40,Math.round(boxW*cap));boxH=Math.max(24,Math.round(boxH*cap));
  const esc2=(boxW<400&&boxH<400)?2:1;           // se dibuja al doble si la caja es chica
  const cv=document.createElement('canvas');
  cv.width=boxW*esc2;cv.height=boxH*esc2;
  const x=cv.getContext('2d');
  const jpeg=(destino.mime||'image/png')==='image/jpeg';
  if(jpeg){x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);}
  const sc=Math.min(cv.width/im.naturalWidth,cv.height/im.naturalHeight);
  const w=im.naturalWidth*sc,h=im.naturalHeight*sc;
  x.drawImage(im,(cv.width-w)/2,(cv.height-h)/2,w,h);   // contain: proporción intacta
  return {dataUrl:cv.toDataURL(jpeg?'image/jpeg':'image/png',.95),mime:jpeg?'image/jpeg':'image/png'};
}

    .concat(liveProds().map(p=>moneyLike(p.base.finalRaw,chainOf(p).fin)));

/* =========================================================================
   ANEXO A — regeneración gráfica (canvas) conservando la estética Lapzo
   ========================================================================= */
function wrapLines(ctx,text,max){
  const out=[];
  String(text||'').split('\n').forEach(par=>{
    let line='';
    par.split(/\s+/).forEach(w=>{
      const t=line?line+' '+w:w;
      if(ctx.measureText(t).width>max&&line){out.push(line);line=w;}else line=t;
    });
    out.push(line);
  });
  return out;
}
/* valor de una celda del anexo: check, guion, texto o add-on */
function anexoCellKind(v){
  const t=String(v||'').trim();
  if(/regalo|obsequio|cortes[íi]a|sin\s+costo/i.test(t))return 'regalo';
  if(/^(s[íi]|si|incluido|check|✓|yes|x|true)$/i.test(t))return 'si';
  if(/add.?on/i.test(t))return 'addon';
  if(!t||/^(no|no incluido|-|–|—|n\/a|ninguno)$/i.test(t))return 'no';
  return 'txt';
}
/* =========================================================================
   ANEXO A — PROPUESTA ECONÓMICA (comparativo año anterior vs renovación)

function renderAnexo(){
  const W=1600,H=900,cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const P='#8B55FE',BG='#171233',VERDE='#01DA8C';
  const rr=(a,b,w,h,r,fill,stroke,lw)=>{
    r=Math.min(r,h/2,w/2);
    x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);
    x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();
    if(fill){x.fillStyle=fill;x.fill();}
    if(stroke){x.strokeStyle=stroke;x.lineWidth=lw||2;x.stroke();}
  };
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  syncAnexo();
  const d=S.anexo.data, an=anexoAnios(), filas=(d.filas||[]).slice(0,10);

  /* ---- logo ---- */
  const drawImg=(url,bx,by,bw,bh)=>{
    if(!url)return false;
    const im=IMGC[url];
    if(!im||!im.naturalWidth)return false;
    const sc=Math.min(bw/im.naturalWidth,bh/im.naturalHeight);
    const w=im.naturalWidth*sc,h=im.naturalHeight*sc;
    rr(bx-14,by-12,w+28,h+24,14,'#fff');
    try{x.drawImage(im,bx,by,w,h);}catch(e){}
    return true;
  };
  if(!drawImg(S.anexo.logoLapzoUrl,1400,44,170,54)){
    x.fillStyle='#fff';x.font='700 44px Poppins,sans-serif';x.textAlign='right';x.fillText('lapzo',1560,86);
  }
  drawImg(S.anexo.logoClienteUrl,58,244,150,78);

  /* ---- título ---- */
  x.textAlign='left';x.textBaseline='alphabetic';
  x.font='300 62px Poppins,sans-serif';x.fillStyle='#fff';
  const t1='Propuesta ';x.fillText(t1,44,112);
  const w1=x.measureText(t1).width;
  x.font='700 62px Poppins,sans-serif';
  const t2='económica',w2=x.measureText(t2).width;
  rr(44+w1-6,58,w2+34,72,10,P);
  x.fillStyle='#fff';x.fillText(t2,44+w1+11,112);

  /* ---- pill de renovación ---- */
  x.font='700 21px Poppins,sans-serif';
  const tr='Propuesta de Renovación '+an.nue, wtr=x.measureText(tr).width;
  rr(44,152,wtr+56,52,26,null,P,2.5);
  x.fillStyle='#fff';x.fillText(tr,72,185);

  /* ---- geometría de columnas ---- */
  const icoX=660, labX=694, labW=128;
  const aX=846, aW=214, aY=120, aH=700;
  const nX=1082, nW=232, nY=108, nH=726;
  rr(aX,aY,aW,aH,28,'#1C1545','#6F4FD8',2);
  rr(nX,nY,nW,nH,30,P);
  x.textAlign='center';x.fillStyle='#fff';x.font='700 24px Poppins,sans-serif';
  x.fillText('Propuesta',aX+aW/2,aY+46);x.fillText(String(an.ant),aX+aW/2,aY+78);
  x.fillText('Propuesta',nX+nW/2,nY+48);x.fillText(String(an.nue),nX+nW/2,nY+80);

  /* ---- filas ---- */
  const top=aY+104, bottom=aY+aH-168, n=Math.max(1,filas.length);
  const step=Math.min(64,(bottom-top)/n);
  const cols=['#F5A623','#8B55FE','#7C6CF5','#F3538E','#01DA8C','#F5A623','#F3538E','#8B55FE','#F5A623'];
  const pill=(cx0,cw,cy,v)=>{
    const ph=Math.min(44,step-10),pw=cw-36,px=cx0+18,py=cy-ph/2;
    rr(px,py,pw,ph,ph/2,'#fff');
    const k=anexoCellKind(v);
    x.textAlign='center';
    if(k==='regalo'){
      // los regalos no llevan paloma: pastilla mint con la leyenda
      rr(px,py,pw,ph,ph/2,VERDE);
      x.fillStyle='#0B2A1F';x.font='700 13px Poppins,sans-serif';
      x.fillText('REGALO',px+pw/2,py+ph/2+5);
    }else if(k==='si'){
      x.strokeStyle=VERDE;x.lineWidth=6;x.lineCap='round';x.beginPath();
      x.moveTo(px+pw/2-13,py+ph/2+1);x.lineTo(px+pw/2-3,py+ph/2+11);x.lineTo(px+pw/2+14,py+ph/2-11);x.stroke();
      x.lineCap='butt';
    }else if(k==='no'){
      x.strokeStyle='#171233';x.lineWidth=6;x.beginPath();
      x.moveTo(px+pw/2-12,py+ph/2);x.lineTo(px+pw/2+12,py+ph/2);x.stroke();
    }else if(k==='addon'){
      x.fillStyle=P;x.font='700 15px Poppins,sans-serif';x.fillText('+ ADD ON',px+pw/2,py+ph/2+6);
    }else{
      x.fillStyle='#171233';x.font='700 18px Poppins,sans-serif';
      let t=String(v).trim();
      while(x.measureText(t).width>pw-20&&t.length>3)t=t.slice(0,-1);
      x.fillText(t,px+pw/2,py+ph/2+7);
    }
  };
  filas.forEach((f,i)=>{
    const cy=top+step*i+step/2;
    x.beginPath();x.arc(icoX,cy,21,0,Math.PI*2);x.fillStyle=cols[i%cols.length];x.globalAlpha=.95;x.fill();x.globalAlpha=1;
    x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();
    x.moveTo(icoX-8,cy);x.lineTo(icoX+7,cy);x.moveTo(icoX+1,cy-6);x.lineTo(icoX+7,cy);x.lineTo(icoX+1,cy+6);x.stroke();
    x.fillStyle='#fff';x.font=(f.regalo?'600 15px':'400 19px')+' Poppins,sans-serif';x.textAlign='left';
    const maxL=f.regalo?3:2, lh=f.regalo?17:22;
    const ls=wrapLines(x,(f.regalo?'\u2726 ':'')+f.nombre,labW).slice(0,maxL);
    ls.forEach((l,k)=>x.fillText(l,labX,cy+(ls.length===1?7:-((ls.length-1)*lh)/2+6+k*lh)));
    x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=1;
    x.beginPath();x.moveTo(labX-56,cy+step/2-2);x.lineTo(aX-8,cy+step/2-2);x.stroke();
    pill(aX,aW,cy,f.ant);
    pill(nX,nW,cy,f.nue);
  });

  /* ---- precios: precio lista (referencia) + valor total pago anual (monto a cobrar) ---- */
  const antTot=totalAnterior(), lista=totalListaNuevo(), fin=totalNuevo();
  const listaAnt=totalListaAnterior();
  const py0=aY+aH-150;                       // bloque de precios más alto: dos importes etiquetados
  x.textAlign='center';

  const bloquePrecios=(cx0,cw,vLista,vPago,destacado,vPct)=>{
    // referencia comercial
    x.fillStyle='rgba(255,255,255,.72)';x.font='600 12px Poppins,sans-serif';
    x.fillText('Precio lista',cx0+cw/2,py0+12);
    x.fillStyle='rgba(255,255,255,.92)';x.font='500 19px Poppins,sans-serif';
    x.fillText(money(vLista,0),cx0+cw/2,py0+36);
    // condición comercial que lleva al monto final
    if(vPct>0){
      x.fillStyle=destacado?'rgba(255,255,255,.95)':'rgba(255,255,255,.7)';
      x.font='700 11px Poppins,sans-serif';
      x.fillText('Dcto. del '+vPct+'% por pago anual',cx0+cw/2,py0+55);
    }
    // monto real a cobrar
    const bh=62,by=py0+66;
    rr(cx0+12,by,cw-24,bh,16,destacado?VERDE:'#2A1B5E',destacado?null:'#7C5CE0',destacado?0:1.5);
    x.fillStyle=destacado?'#0B2A1F':'rgba(255,255,255,.82)';
    x.font='700 12px Poppins,sans-serif';
    x.fillText('Valor total pago anual',cx0+cw/2,by+22);
    x.fillStyle=destacado?'#0B2A1F':'#fff';
    x.font='800 27px Poppins,sans-serif';
    x.fillText(money(vPago,0),cx0+cw/2,by+52);
  };

  x.font='700 18px Poppins,sans-serif';
  const te=d.esquema||'Esquema Anual', wte=Math.max(190,x.measureText(te).width+52);
  rr(labX-56,py0+58,wte,52,26,P);
  x.fillStyle='#fff';x.fillText(te,labX-56+wte/2,py0+91);

  const pctExp=descExplicitoPct();           // el incremento del precio lista no es descuento
  const pctAnt=descExplicitoAnteriorPct();
  bloquePrecios(aX,aW,listaAnt,antTot,false,pctAnt);
  bloquePrecios(nX,nW,lista,fin,true,pctExp);
  if(d.mostrarMensual){
    x.textAlign='center';x.font='600 13px Poppins,sans-serif';x.fillStyle='rgba(255,255,255,.7)';
    x.fillText(money(round2(antTot/Math.max(1,S.ren.meses)),0)+' / mes',aX+aW/2,py0-10);
    x.fillText(money(round2(fin/Math.max(1,S.ren.meses)),0)+' / mes',nX+nW/2,py0-10);
  }

  /* ---- flecha decorativa ---- */
  x.beginPath();x.arc(96,606,46,0,Math.PI*2);x.fillStyle=P;x.fill();
  x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();
  x.moveTo(78,606);x.lineTo(114,606);x.moveTo(102,594);x.lineTo(114,606);x.lineTo(102,618);x.stroke();

  /* ---- leyenda de regalos ---- */
  const hayReg=(filas||[]).some(f=>anexoCellKind(f.nue)==='regalo');
  if(hayReg){
    x.textAlign='left';x.font='600 15px Poppins,sans-serif';x.fillStyle=VERDE;
    x.fillText('\u2726 Producto de regalo · incluido sin costo',44,664);
  }
  /* ---- consideraciones ---- */
  x.textAlign='left';x.fillStyle='#fff';x.font='700 20px Poppins,sans-serif';
  x.fillText('Consideraciones:',44,706);
  let cyy=734;
  (d.consideraciones||[]).slice(0,6).forEach((c,idx)=>{
    x.font=(idx===0?'600 15px':'400 15px')+' Poppins,sans-serif';
    wrapLines(x,c,470).forEach((l,k)=>{
      x.fillStyle='rgba(255,255,255,.92)';
      const pref=idx===0?'':(k===0?'\u2022  ':'    ');
      x.fillText(pref+l,44,cyy);cyy+=21;
    });
  });

  /* ---- vigencia ---- */
  const vg=d.vigencia||vigenciaTexto();
  if(vg){
    x.font='600 17px Poppins,sans-serif';
    const wv=x.measureText(vg).width+52;
    rr(44,H-64,wv,44,12,P);
    x.fillStyle='#fff';x.textAlign='center';x.fillText(vg,44+wv/2,H-35);
  }
  return cv;
}

const IMGC={};
function loadImg(url){
  return new Promise(res=>{
    if(!url)return res(null);
    if(IMGC[url])return res(IMGC[url]);
    const im=new Image();
    im.onload=()=>{IMGC[url]=im;res(im);};
    im.onerror=()=>res(null);
    im.src=url;
  });
}
/* comparación obligatoria entre el cuerpo del acuerdo y el Anexo A */
/* ¿el nombre de una fila del Anexo corresponde a este texto de producto? */
const TOKENS_GENERICOS=['de','del','la','el','los','las','y','o','plan','modulo','modulos','servicio','servicios',
                        'cursos','curso','lapzo','plataforma','por','con','para','taas'];
function filaCoincideCon(nombreFila,textoProducto){
  const tf=normN(nombreFila).split(' ').filter(t=>t.length>2&&TOKENS_GENERICOS.indexOf(t)<0);
  if(!tf.length)return false;
  const tp=normN(textoProducto).split(' ').filter(Boolean);
  return tf.every(t=>tp.some(x=>x.indexOf(t)===0||t.indexOf(x)===0&&x.length>3));
}
function anexoInconsistencias(){
  if(!S.anexo||!S.anexo.data||S.anexo.mode!=='regen')return [];
  if(!S.anexoOk)S.anexoOk={};
  const out=[],d=S.anexo.data;
  const colEsp=(S.colab.mode==='keep'?S.colab.ant:S.colab.nue)||'';
  const fCol=(d.filas||[]).find(f=>/colaborador/.test(normN(f.nombre)));
  if(colEsp&&fCol&&normN(fCol.nue)!==normN(colEsp))
    out.push({id:'colab',campo:'Número de colaboradores',cuerpo:colEsp,anexo:fCol.nue||'—'});
  const vivos=liveProds();
  const prodTxt=normN(vivos.map(p=>p.cur.nombre+' '+(p.cur.modulos||[]).join(' ')+' '+(p.cur.descripcion||'')).join(' '));
  const taas=hayTaaS();
  (d.filas||[]).forEach((f,i)=>{
    if(/colaborador/.test(normN(f.nombre)))return;
    if(f.regalo)return;                                     // los regalos no son productos contratados
    if(taas&&ANEXO_TAAS.some(n=>normN(n)===normN(f.nombre)))return;   // TaaS incluye toda la suite
    // sólo se revisa lo que CAMBIA respecto a la propuesta anterior
    if(anexoCellKind(f.nue)!=='si'||anexoCellKind(f.ant)==='si')return;
    if(filaCoincideCon(f.nombre,prodTxt))return;
    if(normN(f.nombre).split(' ').filter(t=>t.length>2&&TOKENS_GENERICOS.indexOf(t)<0).length===0)return;
    out.push({id:'fila'+i,fila:i,campo:f.nombre,
      cuerpo:'no aparece en los productos de la renovación',
      anexo:'se agrega como incluido'});
  });
  (S.prods||[]).filter(p=>p.action==='del').forEach(p=>{
    const i=(d.filas||[]).findIndex(x=>!x.regalo&&filaCoincideCon(x.nombre,p.base.nombre));
    // si otro producto vivo cubre esa fila, no hay conflicto
    if(i>=0&&vivos.some(v=>filaCoincideCon(d.filas[i].nombre,v.cur.nombre+' '+(v.cur.modulos||[]).join(' ')+' '+(v.cur.descripcion||''))))return;
    if(i>=0&&anexoCellKind(d.filas[i].nue)==='si')
      out.push({id:'del'+i,fila:i,campo:d.filas[i].nombre,cuerpo:'producto eliminado de la renovación',anexo:'sigue marcado como incluido'});
  });
  return out.filter(x=>!S.anexoOk[x.id]);
}
function finalChecks(){
  const C=[],add=(ok,label,hint)=>C.push({ok:!!ok,label,hint:hint||''});
  add(S.emp.razon&&S.emp.taxid,'Información del cliente','Falta razón social o RFC.');
  add(S.ren.inicio&&S.ren.renov,'Vigencia','Define la fecha de inicio.');
  add(S.ren.infl!=null&&!isNaN(S.ren.infl),'Inflación','Captura el porcentaje de inflación.');
  add(liveProds().length>0,'Productos','Debe quedar al menos un producto.');
  add(liveProds().filter(p=>!esRegalo(p)).every(p=>(p.cur.nombre||'').trim()),'Nombres de producto','Hay productos sin nombre.');
  add(liveProds().filter(p=>!esRegalo(p)).every(p=>(p.cur.licenciasRaw||'').trim()),'Licencias','Captura las licencias de cada producto.');
  add(S.colab.mode==='keep'||String(S.colab.nue||'').trim(),'Colaboradores','Captura el nuevo número de colaboradores.');
  add(!anexoInconsistencias().length,'Anexo A vs cuerpo del acuerdo','Resuelve las inconsistencias entre la propuesta y el acuerdo.');
  const errV=validateAgreement().filter(x=>x.severity==='error');
  add(!errV.length,'Datos indispensables',(errV[0]&&errV[0].message)||'Corrige los datos marcados como error.');
  if(hayTaaS()&&S.anexo&&S.anexo.mode==='regen'){
    const d=S.anexo.data,fil=n=>(d.filas||[]).find(x=>normN(x.nombre)===normN(n));
    const faltan=ANEXO_TAAS.filter(n=>{const f=fil(n);return !f||anexoCellKind(f.nue)!=='si';});
    add(!faltan.length,'Anexo A · módulos de TaaS','Faltan por marcar: '+faltan.join(', ')+'.');
    const fb=(d.filas||[]).find(x=>RE_BOLT.test(x.nombre));
    const boltOk=!fb||(boltContratado()?anexoCellKind(fb.nue)==='si':anexoCellKind(fb.nue)!=='si');
    add(boltOk,'Anexo A · Cursos Bolt',boltContratado()?'Cursos Bolt está contratado: debe ir palomeado.':'Cursos Bolt no está contratado: no debe ir palomeado.');
    if(taasAnterior()){
      const faltanAnt=ANEXO_TAAS.filter(n=>{const f=fil(n);return !f||anexoCellKind(f.ant)!=='si';});
      add(!faltanAnt.length,'Anexo A · columna del año anterior','El año anterior también era TaaS: faltan por marcar '+faltanAnt.join(', ')+'.');
      const fbA=(d.filas||[]).find(x=>RE_BOLT.test(x.nombre));
      add(!fbA||(boltAnterior()?anexoCellKind(fbA.ant)==='si':anexoCellKind(fbA.ant)!=='si'),
          'Anexo A · Cursos Bolt (año anterior)',
          boltAnterior()?'El acuerdo anterior sí traía Cursos Bolt: debe ir palomeado.':'No hay evidencia de Cursos Bolt en el acuerdo anterior: debe ir con guion.');
      const fgA=(d.filas||[]).find(x=>x.regalo);
      add(!fgA||gestionAnterior()||anexoCellKind(fgA.ant)!=='si','Anexo A · regalo no retroactivo',
          'Gestión de personal no debe aparecer como incluida en la propuesta del año anterior.');
    }
    const fg=(d.filas||[]).find(x=>x.regalo);
    add(!!fg&&/en construcci[oó]n/i.test(fg.nombre),'Anexo A · producto de regalo',
        'Gestión de personal debe aparecer como producto de regalo con la leyenda «(En construcción)».');
    add(CONSIDERACIONES_STD.every((c,i)=>(d.consideraciones||[])[i]===c),'Anexo A · consideraciones',
        'Las consideraciones deben ser exactamente las cuatro estándar, en orden. Usa «Restaurar consideraciones estándar».');
  }
  add(!hayTaaS()||!regalosPendientes().length,'Productos de regalo de TaaS',
      'Falta el nombre del segundo producto de regalo; mientras esté vacío no se incluye.');
  add(!!S.logoCli.url||S.logoCli.omitir,'Logo del cliente','Sube el logo del cliente en el paso 3 (o marca «Generar sin logo»).');
  const maq=S.gen?validarMaquetacionPdf():[];
  add(!S.gen||!maq.length,'Estructura de 3 páginas',(maq[0]||'Regenera la vista previa.'));
  add(!S.gen||!validateSignatureArea().length,'Zona de firmas sin firmas anteriores',(validateSignatureArea()[0]||'Regenera la vista previa.'));
  add(liveProds().every(p=>!esPagado(p.cur)||chainOf(p).baseP>0),'Información económica',
      'Hay productos con precio pendiente: captúralo o marca su condición (incluido, obsequio, bonificado o sin costo).');
  add(liveProds().every(p=>{const c=chainOf(p);return c.desc>=0&&c.fin>=0&&(c.descTipo!=='monto'||c.descVal<=c.act);}),'Descuentos','Un descuento excede el precio actualizado.');
  add(totalNuevo()>0,'Valor total','El total debe ser mayor a cero.');
  add(pagosOk(),'Forma de pago','La suma de parcialidades debe igualar el valor total.');
  add(Object.keys(S.perKeep).every(k=>S.perKeep[k]||(S.per[k].nombre||'').trim()),'Personas','Falta el nombre de una persona modificada.');
  add((S.per.firmaCliente.nombre||'').trim()&&(S.per.firmaLapzo.nombre||'').trim(),'Firmantes','Faltan datos de firmantes.');
  add(!S.anexo.imgRid||S.anexo.mode!=='upload'||S.anexo.upload,'Anexo A','Sube la imagen del Anexo A o elige otra opción.');
  add(!issuesPendientes().length,'Inconsistencias resueltas','Vuelve al paso 2.');
  return C;
}

async function doBuild(){
  const v=S.stateVersion;
  S.gen=null;                                        // nunca se mezcla con una vista previa anterior
  S.previewStatus='generating';S.genBusy='preview';render();
  await new Promise(r=>setTimeout(r,0));
  say('Actualizando acuerdo…',true);
  try{
    recalcPagos(S.pay.mode==='keep');                // se recalculan los derivados
    syncRegalosTaaS();syncAnexo();
    S.logoFit=await logoAjustado(logoDestino());
    await Promise.all([S.anexo.logoLapzoUrl,S.anexo.logoClienteUrl,S.anexo.upload].map(loadImg));
    const g=buildDoc();
    g.version=v;
    S.gen=g;
    S.previewStatus=(v===S.stateVersion)?'current':'outdated';
  }catch(e){
    console.error(e);S.previewStatus='error';S.genError=e.message;
    alert('Error al generar la vista previa: '+e.message);
  }
  S.genBusy='';say('');render();
  return S.previewStatus==='current'||S.previewStatus==='outdated';
}
/* errores que sí bloquean el archivo final vs advertencias que no */
function erroresBloqueantes(){
  const out=[];
  const push=(c,m)=>{if(!c)out.push(m);};
  push(!!(S.emp&&S.emp.razon),'Falta la razón social del cliente.');
  push(!!S.vigOk,'Confirma la vigencia propuesta en el paso 4.');
  push(!issuesPendientes().length,'Resuelve las inconsistencias del acuerdo anterior en el paso 2 ('+issuesPendientes().length+').');
  push(!!S.ren.inicio&&!!S.ren.renov,'La vigencia de la renovación no es válida.');
  push(S.ren.infl!=null&&!isNaN(S.ren.infl),'Falta capturar la inflación.');
  push(liveProds().length>0,'Debe quedar al menos un producto en la renovación.');
  pendientesCriticos().forEach(x=>out.push(x.producto+': '+x.message.toLowerCase()+' (paso 6).'));
  push(pagosOk(),'La suma de las parcialidades no coincide con el valor total.');
  push(!!S.logoCli.url||S.logoCli.omitir,'Falta el logo del cliente (o marca «Generar sin logo»).');
  push(!validateAgreement().filter(x=>x.severity==='error').length,'Hay datos indispensables marcados como error en la revisión pendiente.');
  // total de productos = valor total = plan de pagos = valor total pago anual del Anexo A
  const sumaProd=round2(liveProds().filter(p=>esPagado(p.cur)).reduce((a,p)=>a+chainOf(p).fin,0));
  const totalSrv=totalNuevo();
  const sumaPagos=round2((S.pay.pagos||[]).reduce((a,x)=>a+(x.monto||0),0));
  if(Math.abs(sumaProd-totalSrv)>1)out.push('La suma de los productos ('+money(sumaProd)+') no coincide con el valor total del servicio ('+money(totalSrv)+').');
  if(Math.abs(sumaPagos-totalSrv)>1)out.push('Los pagos suman '+money(sumaPagos)+', pero el valor total del servicio es '+money(totalSrv)+'. Ajústalos en el paso 7.');
  liveProds().filter(p=>esPagado(p.cur)&&!p.cur.listaPubManual).forEach(p=>{
    const c=chainOf(p);
    if(Math.abs(c.listaPub-c.fin*FACTOR_LISTA)>1)
      out.push('El precio lista de «'+(p.cur.nombre||'').slice(0,26)+'» no corresponde al valor final +'+PCT_LISTA+'%.');
  });
  // el firmante del cliente sí es indispensable; el DECASOL es dato fijo y se arma solo
  push(!!(S.per&&S.per.firmaCliente&&S.per.firmaCliente.nombre),'Falta el nombre del firmante del cliente.');
  push(!!(S.per&&S.per.firmaCliente&&S.per.firmaCliente.cargo),'Falta el cargo del firmante del cliente.');
  push(totalNuevo()>0,'Falta el valor total de la renovación.');
  if(S.gen&&S.previewStatus==='current')validateSignatureArea().forEach(m=>out.push(m));
  return out;
}
function advertencias(){
  const out=[];
  if(S.gen&&S.gen.residues&&S.gen.residues.length)out.push('Posibles residuos del acuerdo anterior: '+S.gen.residues.join(' · '));
  (S.prods||[]).filter(p=>p.revisar).forEach(p=>out.push('«'+(p.cur.nombre||'').slice(0,28)+'»: '+p.revisar));
  // sólo se avisa si ese producto ya no existe en la renovación (por tipo, no por nombre ni id)
  const vivosTipos=liveProds().map(tipoProducto);
  (S.prods||[]).filter(p=>p.action==='del').forEach(p=>{
    const tp=tipoProducto(p);
    if(vivosTipos.indexOf(tp)>=0)return;                 // se volvió a agregar, se editó o cambió de nombre
    out.push('Se eliminó de la renovación «'+((p.base&&p.base.nombre)||'producto').slice(0,28)+'».');
  });
  (S.prods||[]).filter(p=>p.cur&&p.cur.listaPubManual).forEach(p=>out.push('Precio lista capturado a mano en «'+(p.cur.nombre||'').slice(0,28)+'».'));
  if(S.gen&&S.previewStatus==='current')validarMaquetacionPdf().forEach(m=>out.push('Estructura de páginas: '+m));
  anexoInconsistencias().forEach(x=>out.push('Anexo A · '+x.campo+': '+x.cuerpo+' / '+x.anexo));
  validateAgreement().filter(x=>x.severity==='warning').forEach(x=>out.push(x.message));
  return out;
}

    try{bin=atob(m[2]);}catch(e){return null;}          // base64 incompleto o inválido

/* el paquete se vuelve a abrir como ZIP y se comprueba antes de ofrecerlo */
async function validarPaqueteDocx(blob){
  const out=[];
  if(!blob)return ['no se produjo ningún archivo'];
  if(!blob.size)out.push('el archivo salió vacío');
  if(blob.type.indexOf('wordprocessingml.document')<0)out.push('el tipo MIME no corresponde a un DOCX');
  try{
    const ab=await blob.arrayBuffer();
    const u8=new Uint8Array(ab.slice(0,4));
    if(!(u8[0]===0x50&&u8[1]===0x4B))out.push('el archivo no empieza con una firma ZIP válida');
    const z=await JSZip.loadAsync(ab);
    ['[Content_Types].xml','word/document.xml','word/_rels/document.xml.rels'].forEach(n=>{
      if(!z.file(n))out.push('falta '+n);
    });
    const doc=z.file('word/document.xml');
    if(doc){
      const t=await doc.async('string');
      if(t.indexOf('</w:document>')<0)out.push('word/document.xml quedó incompleto');
      const d=new DOMParser().parseFromString(t,'application/xml');
      if(d.getElementsByTagName('parsererror').length)out.push('word/document.xml no es XML bien formado');
    }
  }catch(e){out.push('no se pudo reabrir el paquete como ZIP ('+e.message+')');}
  return out;
}
async function doDocx(){
  const errB=erroresBloqueantes();
  if(errB.length){alert('No se generó el DOCX.\n\n• '+errB.join('\n• '));return;}
  S.genBusy='docx';render();await new Promise(r=>setTimeout(r,0));
  const ok=await asegurarVistaPrevia();       // el DOCX sale siempre del estado actual
  S.genBusy='docx';
  if(!ok){S.genBusy='';render();return;}
  const prob=validateSignatureArea();
  if(prob.length){S.genBusy='';render();alert('No se generó el documento.\n\n'+prob.join('\n'));return;}
  say('Generando DOCX editable…',true);
  try{
    let blob;
    if(S.gen&&S.gen.xml){
      const zip=await JSZip.loadAsync(S.src.ab);
      zip.file('word/document.xml',S.gen.xml);
      if(S.gen.anexoUrl&&S.anexo.imgRid&&S.src.media[S.anexo.imgRid])
        zip.file(S.src.media[S.anexo.imgRid].path,S.gen.anexoUrl.split(',')[1],{base64:true});
      const dLogo=logoDestino();
      if(dLogo&&S.logoFit)zip.file(dLogo.path,S.logoFit.dataUrl.split(',')[1],{base64:true});
      blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    }else{
      blob=await docxDesdeEstado();           // origen PDF: documento nuevo y editable
    }
    const mal=await validarPaqueteDocx(blob);
    if(mal.length){
      console.error('DOCX inválido:',mal);
      throw new Error('el paquete no pasó la validación ('+mal.join('; ')+')');
    }
    const nombre=fileBase()+'.docx';
    if(!/\.docx$/.test(nombre))throw new Error('nombre de archivo inválido');
    dl(blob,nombre);
    say('✓ DOCX generado correctamente.');
  }catch(e){
    console.error(e);
    say('');
    if(confirm('No fue posible generar el archivo Word correctamente.\n\n'+e.message+'\n\n¿Reintentar?')){
      S.genBusy='';render();setTimeout(doDocx,50);return;
    }
  }
  S.genBusy='';render();
}
