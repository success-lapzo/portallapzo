const normLoose=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[*.:,;()\[\]$]/g,' ').replace(/\s+/g,' ').trim();
const RE_TOTAL_SERVICIO=/(valor\s+total\s+del\s+servicio|total\s+del\s+servicio|valor\s+total\s+sin\s+iva|valor\s+total)/i;
const esLineaTotal=t=>{
  const n=normLoose(t);
  return /(valor total del servicio|total del servicio|valor total sin iva|^valor total\b)/.test(n);
};
const RE_INICIO_PEDIDO=/detalle\s+del\s+pedido|t[ée]rminos\s+de\s+pago|condiciones\s+de\s+pago/i;
/* parte los bloques de la vista previa en los tres grupos de página */
function gruposDePagina(){
  const body=$('#docBody');
  if(!body)return null;
  const dw=body.querySelector('.dw')||body;      // el render envuelve todo en .dw
  const nodos=Array.prototype.slice.call(dw.children).filter(n=>n.nodeType===1);
  const txt=n=>(n.textContent||'').replace(/\s+/g,' ').trim();
  let iTotal=-1,iPedido=-1,iFirmas=-1;
  // 1) cortes explícitos marcados al construir el documento
  nodos.forEach((n,k)=>{
    const c=n.getAttribute&&n.getAttribute('data-cut');
    if(c==='total')iTotal=k-1<0?0:k-1;
    if(c==='firmas')iFirmas=k;
  });
  nodos.forEach((n,k)=>{
    const t=txt(n);
    if(iTotal<0&&esLineaTotal(t))iTotal=k;                       // 2) búsqueda semántica flexible
    if(iPedido<0&&iTotal>=0&&k>iTotal&&RE_INICIO_PEDIDO.test(t))iPedido=k;
    if(iFirmas<0&&RE_ZONA_FIRMA.test(t))iFirmas=k;
  });
  // 3) respaldos estructurales: nunca se bloquea la generación por no hallar una frase
  if(iTotal<0){
    const iPed=nodos.findIndex(n=>RE_INICIO_PEDIDO.test(txt(n)));
    if(iPed>0)iTotal=iPed-1;
    else{
      let ultTabla=-1;
      nodos.forEach((n,k)=>{if(n.tagName==='TABLE')ultTabla=k;});
      iTotal=ultTabla>0?ultTabla:Math.max(0,Math.floor(nodos.length*0.35));
    }
  }
  if(iFirmas<0){
    const iAnexo=nodos.findIndex(n=>/anexo\s+a/i.test(txt(n)));
    iFirmas=iAnexo>0?iAnexo:Math.max(iTotal+1,Math.floor(nodos.length*0.75));
  }
  // el bloque de firma arranca en la razón social que va justo antes del encabezado de firma
  if(iFirmas>0){
    for(let k=iFirmas-1;k>=Math.max(0,iFirmas-3);k--){
      const t=txt(nodos[k]);
      if(/s\.?\s?a\.?\s*de\s*c\.?\s?v\.?|s\.a\.s|inc\.|ltda/i.test(t)){iFirmas=k;break;}
      if(t)break;
    }
  }
  const corte1=Math.max(1,iTotal+1);
  const corte2=Math.max(corte1,iFirmas);
  return {
    p1:nodos.slice(0,corte1),
    p2:nodos.slice(corte1,corte2),
    p3:nodos.slice(corte2),
    marcas:{total:iTotal,pedido:iPedido,firmas:iFirmas}
  };
}
/* arma una página aislada, la compacta si hace falta y la mide */
function armarPagina(nodos,pg,nPag,total){
  const cont=document.createElement('div');
  cont.className='dw pdfpage';
  cont.style.cssText='position:absolute;left:-10000px;top:0;background:#fff;width:'+pg.w+'px;'+
    'padding:'+(nPag===1?36:pg.top)+'px '+pg.right+'px '+pg.bottom+'px '+pg.left+'px;box-sizing:border-box;'+
    'display:flex;flex-direction:column;';
  const hh=(typeof headerHtmlPreview==='function')?headerHtmlPreview():'';
  if(hh){
    const h=document.createElement('div');
    h.innerHTML=hh;                      // sin el envoltorio con padding de la vista previa
    h.style.cssText='margin:0 0 6px';
    cont.appendChild(h);
  }
  const zona=document.createElement('div');
  zona.className='pdfzona';
  nodos.forEach(n=>zona.appendChild(n.cloneNode(true)));
  cont.appendChild(zona);
  const pie=document.createElement('div');
  pie.style.cssText='text-align:center;font-size:9pt;color:#170F33;margin-top:auto;padding-top:10px';
  pie.textContent=String(nPag);
  cont.appendChild(pie);
  document.body.appendChild(cont);
  return cont;
}
/* ajuste progresivo: espacios → paddings → interlineado → tamaño (último recurso) */
const PDF_NIVELES=[
  {clase:'',                 nota:'espaciado normal'},
  {clase:'pdf-c1',           nota:'menos espacio vertical'},
  {clase:'pdf-c1 pdf-c2',    nota:'menos padding en tablas'},
  {clase:'pdf-c1 pdf-c2 pdf-c3', nota:'interlineado más compacto'}
];
const PDF_ESCALA_MIN=.74;
function ajustarPagina(cont,disponible){
  cont.style.height='auto';
  for(let n=0;n<PDF_NIVELES.length;n++){
    cont.className='dw pdfpage '+PDF_NIVELES[n].clase;
    if(cont.scrollHeight<=disponible)return {nivel:n,alto:cont.scrollHeight,nota:PDF_NIVELES[n].nota,escala:1};
  }
  // último recurso: se reduce la página completa como imagen, sin reflujo de texto
  const esc=disponible/cont.scrollHeight;
  return {nivel:PDF_NIVELES.length-1,alto:cont.scrollHeight,
          nota:PDF_NIVELES[PDF_NIVELES.length-1].nota+' · página reducida al '+Math.round(esc*100)+'%',
          escala:esc};
}
/* validación previa: 3 páginas, nada cortado, Anexo A completo */
function validarMaquetacionPdf(){
  const out=[];
  const g=gruposDePagina();
  if(!g){out.push('La vista previa aún no está en pantalla: regenérala para revisar la estructura de 3 páginas.');return out;}
  const t=n=>(n.textContent||'').replace(/\s+/g,' ').trim();
  if(!g.p1.length)out.push('La página 1 quedó vacía.');
  if(!g.p2.length)out.push('La página 2 (detalle del pedido) quedó vacía.');
  if(!g.p3.length)out.push('La página 3 (firmas y Anexo A) quedó vacía.');
  const p1=g.p1.map(t).join(' ');
  if(!esLineaTotal(p1)&&!/=\s*\$/.test(p1))out.push('El valor total del servicio no quedó en la página 1.');
  if(g.p1.some(n=>RE_ZONA_FIRMA.test(t(n))))out.push('Hay bloques de firma en la página 1.');
  const p2=g.p2.map(t).join(' ');
  if(g.p2.length&&!RE_INICIO_PEDIDO.test(p2))out.push('La página 2 no inicia con el detalle del pedido ni con los términos de pago.');
  const p3=g.p3.map(t).join(' ');
  if(!/firma\s+del\s+representante|decasol/i.test(p3))out.push('Las firmas no quedaron en la página 3.');
  if(!/anexo\s+a/i.test(p3))out.push('El Anexo A no quedó en la página 3.');
  const tieneImg=n=>n.tagName==='IMG'||(n.querySelector&&!!n.querySelector('img'));
  if(S.anexo&&S.anexo.mode!=='none'&&!g.p3.some(tieneImg))
    out.push('El Anexo A no aparece como imagen en la página 3.');
  return out;
}
async function doPdf(){
  const errB=erroresBloqueantes();
  if(errB.length){alert('No se generó el PDF.\n\n• '+errB.join('\n• '));return;}
  S.genBusy='pdf';render();await new Promise(r=>setTimeout(r,0));
  const ok=await asegurarVistaPrevia();          // siempre se reconstruye desde el estado actual
  S.genBusy='pdf';
  if(!ok){S.genBusy='';render();return;}
  const page=$('#docPage');
  if(!page){S.genBusy='';render();return;}
  const prob=validateSignatureArea();
  if(prob.length){alert('No se generó el PDF.\n\n'+prob.join('\n')+'\n\nRegenera la vista previa para reconstruir la zona de firmas.');return;}
  const malo=validarMaquetacionPdf();      // avisos de maquetación: no impiden generar
  say('Maquetando el PDF en 3 páginas…',true);
  const conts=[];
  try{
    const pg=S.src.pg||{w:794,h:1123,top:113,bottom:75,left:104,right:95};
    const g=gruposDePagina();
    const grupos=[g.p1,g.p2,g.p3];
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'px',format:[pg.w,pg.h],orientation:'portrait'});
    const notas=[];
    for(let i=0;i<3;i++){
      say('Maquetando página '+(i+1)+' de 3…',true);
      const cont=armarPagina(grupos[i],pg,i+1,3);
      conts.push(cont);
      const aj=ajustarPagina(cont,pg.h);
      notas.push('Página '+(i+1)+': '+aj.nota+(aj.escala<1?' · reducida al '+Math.round(aj.escala*100)+'%':''));
      if(aj.escala<PDF_ESCALA_MIN)throw new Error('la página '+(i+1)+' no cabe sin reducirla por debajo de un tamaño legible ('+Math.round(aj.escala*100)+'%): quita contenido o divide productos');
      if(aj.escala>=1)cont.style.height=pg.h+'px';         // página completa
      const canvas=await html2canvas(cont,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:pg.w});
      if(i)pdf.addPage([pg.w,pg.h],'portrait');
      pdf.setFillColor(255,255,255);pdf.rect(0,0,pg.w,pg.h,'F');
      if(aj.escala>=1){
        pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,pg.w,pg.h);
      }else{
        // la imagen se ajusta a la página conservando proporción (no se deforma ni se recorta)
        const k=Math.min(pg.w/canvas.width,pg.h/canvas.height);
        const w=canvas.width*k,h=canvas.height*k;
        pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',(pg.w-w)/2,0,w,h);
      }
    }
    if(pdf.getNumberOfPages()!==3)throw new Error('el PDF no quedó en 3 páginas');
    pdf.save(fileBase()+'.pdf');
    S.pdfNotas=notas.concat(malo.map(m=>'Aviso: '+m));
    say('PDF de 3 páginas generado.');
  }catch(e){console.error(e);alert('No se pudo generar el PDF: '+e.message);say('');}
  finally{conts.forEach(c=>{if(c.parentNode)c.parentNode.removeChild(c);});S.genBusy='';render();}
}

/* =========================================================================
   AUTOGUARDADO — sobrevive a un recargado accidental de la vista
   ========================================================================= */
const BORRADOR_KEY='lapzo_renovacion_borrador_v1';
function almacen(){
  try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}catch(e){
    try{sessionStorage.setItem('__t','1');sessionStorage.removeItem('__t');return sessionStorage;}catch(e2){return null;}
  }
}
/* sólo las decisiones: el documento original no se guarda (pesa megas) */
function snapshotRenovacion(){
  if(!S.ext)return null;
  return {
    v:1,ts:Date.now(),archivo:S.docFileName||'',cliente:(S.emp&&(S.emp.nombre||S.emp.razon))||'',
    extractMode:S.extractMode,
    documentoOriginal:{nombre:S.docFileName||'',tipo:S.src?S.src.kind:'',paginas:S.src?S.src.numPages||null:null},
    ext:S.ext,original:S.original,
    cliente_:S.emp,personas:S.per,perKeep:S.perKeep,
    vigencia:{inicio:S.ren.inicio,renov:S.ren.renov,meses:S.ren.meses,mesesSource:S.ren.mesesSource,vigOk:S.vigOk},
    inflacion:S.ren.infl,envio:S.envio,
    colaboradores:S.colab,
    productos:(S.prods||[]).map(p=>({id:p.id,tipo:p.tipo,isNew:p.isNew,action:p.action,applyInfl:p.applyInfl,
      priceEdited:p.priceEdited,giftSlot:p.giftSlot,giftFijo:p.giftFijo,taasStd:p.taasStd,revisar:p.revisar,
      base:p.base,cur:p.cur})),
    formaPago:S.pay,usoLogo:S.logo,
    anexoA:S.anexo?{mode:S.anexo.mode,data:S.anexo.data,imgRid:S.anexo.imgRid}:null,
    bloques:S.blocks,okIssues:S.okIssues,manual:S.manual,anexoOk:S.anexoOk,
    baseTotalAnt:S.baseTotalAnt,baseTotalAntManual:!!S.baseTotalAntManual,
    decisiones:(S.issues||[]).map(i=>({id:i.id,choice:i.choice,custom:i.custom})),
    taasApplied:S.taasApplied,taasAntApplied:S.taasAntApplied,step:S.step,maxStep:S.maxStep
  };
}
let SAVE_T=null;
function guardarBorrador(){
  const st=almacen();
  if(!st)return;
  clearTimeout(SAVE_T);
  SAVE_T=setTimeout(()=>{
    try{
      const snap=snapshotRenovacion();
      if(snap)st.setItem(BORRADOR_KEY,JSON.stringify(snap));
    }catch(e){/* cuota o entorno sin almacenamiento: se ignora */}
  },400);
}
function leerBorrador(){
  const st=almacen();
  if(!st)return null;
  try{const raw=st.getItem(BORRADOR_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
}
function borrarBorrador(){
  const st=almacen();
  if(st)try{st.removeItem(BORRADOR_KEY);}catch(e){}
}
/* aplica un borrador sobre una extracción recién hecha del MISMO documento */
function aplicarBorrador(b){
  if(!b)return false;
  try{
    S.ext=b.ext||S.ext;S.original=b.original||S.original;
    if(b.cliente_)S.emp=b.cliente_;
    if(b.personas)S.per=b.personas;
    if(b.perKeep)S.perKeep=b.perKeep;
    if(b.vigencia){S.ren.inicio=b.vigencia.inicio;S.ren.renov=b.vigencia.renov;
      S.ren.meses=b.vigencia.meses||DURACION_ESTANDAR;S.ren.mesesSource=b.vigencia.mesesSource||'default';
      S.vigOk=!!b.vigencia.vigOk;}
    if(b.inflacion!=null)S.ren.infl=b.inflacion;
    if(b.envio)S.envio=b.envio;
    if(b.colaboradores)S.colab=b.colaboradores;
    if(b.productos&&b.productos.length){
      S.prods=b.productos.map(p=>Object.assign({},p));
      PIDSEQ=Math.max(PIDSEQ,b.productos.length+2);
    }
    if(b.formaPago)S.pay=b.formaPago;
    if(b.usoLogo)S.logo=b.usoLogo;
    if(b.anexoA&&S.anexo){S.anexo.mode=b.anexoA.mode;S.anexo.data=b.anexoA.data;}
    if(b.bloques)S.blocks=b.bloques;
    if(b.okIssues)S.okIssues=b.okIssues;
    if(b.manual)S.manual=b.manual;
    if(b.anexoOk)S.anexoOk=b.anexoOk;
    if(b.baseTotalAnt!=null)S.baseTotalAnt=b.baseTotalAnt;
    S.baseTotalAntManual=!!b.baseTotalAntManual;
    S.taasApplied=!!b.taasApplied;S.taasAntApplied=!!b.taasAntApplied;
    const prev={};(b.decisiones||[]).forEach(d=>{prev[d.id]={choice:d.choice,custom:d.custom};});
    S.issues=buildIssues().map(x=>Object.assign(x,prev[x.id]||{}));
    S.maxStep=b.maxStep||S.maxStep;
    syncAnexo();recalcPagos(S.pay.mode==='keep');
    S.recuperado=true;
    return true;
  }catch(e){console.error(e);return false;}
}

/* ---------- carga y validacion del logo del cliente ---------- */
async function handleLogo(f){
  const L={url:null,name:f.name||'logo',mime:f.type||'',w:0,h:0,omitir:S.logoCli.omitir,error:''};
  const okTipo=/^image\/(png|jpeg|jpg|webp|svg\+xml)$/i.test(f.type)||/\.(png|jpe?g|webp|svg)$/i.test(f.name||'');
  if(!okTipo){S.logoCli=Object.assign(L,{error:'No fue posible utilizar este logo. Prueba con PNG, JPG o WEBP.'});render();return;}
  if(f.size>8*1024*1024){S.logoCli=Object.assign(L,{error:'El archivo pesa más de 8 MB. Usa una versión más ligera del logo.'});render();return;}
  try{
    const dataUrl=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('lectura'));fr.readAsDataURL(f);});
    const esSvg=/svg/i.test(f.type)||/\.svg$/i.test(f.name||'');
    const im=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=dataUrl;});
    if(!im||!im.naturalWidth){S.logoCli=Object.assign(L,{error:'No fue posible utilizar este logo: el archivo no se pudo renderizar. Prueba con PNG, JPG o WEBP.'});render();return;}
    let w=im.naturalWidth,h=im.naturalHeight;
    if(esSvg&&(w<40||h<40)){w=800;h=Math.round(800*(im.naturalHeight/im.naturalWidth||0.5));}
    if(Math.min(w,h)<32){S.logoCli=Object.assign(L,{error:'El logo tiene muy poca resolución ('+w+'×'+h+' px). Usa un archivo de al menos 32 px por lado.'});render();return;}
    // se normaliza a PNG (tambien convierte SVG) conservando la proporcion
    const escala=Math.min(1,1200/Math.max(w,h));
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(w*escala));cv.height=Math.max(1,Math.round(h*escala));
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    S.logoCli={url:cv.toDataURL('image/png'),name:f.name||'logo.png',mime:'image/png',w:cv.width,h:cv.height,omitir:S.logoCli.omitir,error:''};
    render();
  }catch(e){
    S.logoCli=Object.assign(L,{error:'No fue posible utilizar este logo ('+e.message+'). Prueba con PNG, JPG o WEBP.'});render();
  }
}
document.addEventListener('change',e=>{
  if(e.target.id==='fileIn'&&e.target.files[0])handleFile(e.target.files[0]);
  if(e.target.id==='logoFile'&&e.target.files[0])handleLogo(e.target.files[0]);
  if(e.target.id==='anexoFile'&&e.target.files[0]){
    const f=e.target.files[0],fr=new FileReader();
    fr.onload=async()=>{
      const im=await loadImg(fr.result);
      if(!im){alert('No se pudo leer la imagen.');return;}
      const orig=S.src.media[S.anexo.imgRid];
      const mime=orig&&orig.mime==='image/jpeg'?'image/jpeg':'image/png';
      const cv=document.createElement('canvas');
      cv.width=im.naturalWidth;cv.height=im.naturalHeight;
      cv.getContext('2d').drawImage(im,0,0);
      S.anexo.upload=cv.toDataURL(mime,.95);
      render();
    };
    fr.readAsDataURL(f);
  }
});
document.addEventListener('dragover',e=>{
  const d=$('#drop');if(!d)return;
  e.preventDefault();d.classList.add('hot');
});
document.addEventListener('dragleave',e=>{const d=$('#drop');if(d)d.classList.remove('hot');});
document.addEventListener('drop',e=>{
  const d=$('#drop');if(!d)return;
  e.preventDefault();d.classList.remove('hot');
  if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);
});
