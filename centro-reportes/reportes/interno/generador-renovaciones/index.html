<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Renovaciones Lapzo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#8B55FE; --p2:#5029A2; --p-soft:#F3EEFF; --ink:#17102E; --mint:#01DA8C; --pink:#F3538E;
  --g0:#FFFFFF; --g1:#F7F7F9; --g2:#EFEFF3; --g3:#DCDCE4; --g4:#8A8A99; --g5:#54545F;
  --amber:#B7791F; --amber-bg:#FEF6E7; --red:#C2334D; --red-bg:#FDEEF1; --ok:#0B8A5B; --ok-bg:#E8F8F1;
  --font:'Poppins','Century Gothic','Trebuchet MS',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{font-family:var(--font);background:var(--g1);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--g3);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);outline-offset:-1px;border-color:var(--p)}
input[type=checkbox],input[type=radio]{width:auto}
label.f{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--g4);margin-bottom:4px;font-weight:600}
a{color:var(--p2)}

/* ---------- shell ---------- */
.top{background:#fff;border-bottom:1px solid var(--g2);padding:14px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--g4);letter-spacing:.02em;text-transform:uppercase}
.steps{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.chip{font-size:11px;padding:5px 10px;border-radius:999px;background:var(--g1);color:var(--g5);border:1px solid var(--g2);white-space:nowrap}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.chip.done{background:var(--p-soft);color:var(--p2);border-color:#E2D6FF}
.chip.dis{opacity:.45}
.bar{height:3px;background:var(--g2)}
.bar>div{height:100%;background:var(--p);transition:width .25s ease}
.wrap{max-width:1080px;margin:0 auto;padding:26px 22px 120px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--g5);font-size:13px;margin-top:4px}
.card{background:#fff;border:1px solid var(--g2);border-radius:14px;padding:20px;margin-top:16px}
.card.tight{padding:14px 16px}
.card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--p2);font-weight:700;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.steps{display:none}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{margin-left:auto}
hr{border:0;border-top:1px solid var(--g2);margin:16px 0}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--g3);background:#fff;color:var(--ink);border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;transition:.12s}
.btn:hover{border-color:var(--g4)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:#7a45ec}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--p2);text-decoration:underline;padding:6px 4px}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--p2);border-color:var(--p2);color:#fff}
.seg{display:inline-flex;border:1px solid var(--g3);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:12px;font-weight:600;color:var(--g5);border-right:1px solid var(--g3)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--p);color:#fff}
.seg button.on.warn{background:var(--amber)}
.seg button.on.bad{background:var(--red)}

/* ---------- dropzone ---------- */
.drop{border:2px dashed var(--g3);border-radius:16px;background:#fff;padding:48px 24px;text-align:center;transition:.15s}
.drop.hot{border-color:var(--p);background:var(--p-soft)}
.drop .ic{font-size:30px}
.file{display:flex;gap:12px;align-items:center;background:var(--g1);border:1px solid var(--g2);border-radius:10px;padding:10px 12px;font-size:13px}
.file b{font-weight:600}

/* ---------- misc ---------- */
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--g2);color:var(--g5)}
.tag.new{background:var(--ok-bg);color:var(--ok)}
.tag.mod{background:var(--amber-bg);color:var(--amber)}
.tag.del{background:var(--red-bg);color:var(--red)}
.tag.same{background:var(--g2);color:var(--g4)}
.tag.p{background:var(--p-soft);color:var(--p2)}
.note{border-radius:10px;padding:12px 14px;font-size:13px;border:1px solid}
.note.warn{background:var(--amber-bg);border-color:#F2DEB4;color:#6B4B10}
.note.bad{background:var(--red-bg);border-color:#F3C9D2;color:#7A1F31}
.note.ok{background:var(--ok-bg);border-color:#BEE9D6;color:#0A5F41}
.note.info{background:var(--p-soft);border-color:#E2D6FF;color:#3C1F7A}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--g4);padding:8px 10px;border-bottom:1px solid var(--g2);font-weight:700}
table.t td{padding:9px 10px;border-bottom:1px solid var(--g2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.chain{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;align-items:center;background:var(--g1);border:1px solid var(--g2);border-radius:10px;padding:10px}
.chain .k{color:var(--g4);font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block}
.chain .v{font-weight:600;font-variant-numeric:tabular-nums}
.chain .ar{color:var(--g3);font-weight:700}
.chain .fin .v{color:var(--p2);font-size:15px}
.pcard{border:1px solid var(--g2);border-radius:12px;padding:16px;margin-top:12px;background:#fff}
.pcard.del{opacity:.6;background:var(--g1)}
.pcard h4{font-size:15px;font-weight:700;letter-spacing:-.01em}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mod{background:var(--p-soft);color:var(--p2);border:1px solid #E2D6FF;border-radius:7px;padding:4px 8px;font-size:12px;display:flex;gap:6px;align-items:center}
.mod button{border:0;background:transparent;color:var(--p2);font-weight:700;line-height:1;padding:0}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;padding:6px 0}
.chk .b{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;margin-top:1px}
.chk.y .b{background:var(--ok-bg);color:var(--ok)}
.chk.n .b{background:var(--red-bg);color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--g2);font-size:13px}
.kv:last-child{border:0}
.kv span:first-child{color:var(--g5)}
.kv span:last-child{font-weight:600;text-align:right}
.big{display:flex;gap:22px;flex-wrap:wrap}
.big div{background:var(--g1);border:1px solid var(--g2);border-radius:12px;padding:14px 18px;min-width:150px}
.big .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--g4);font-weight:700}
.big .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px}
.mini{font-size:12px;color:var(--g5)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--g3);border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--g2);padding:12px 22px;display:flex;gap:10px;align-items:center;z-index:40}
.foot .inner{max-width:1080px;margin:0 auto;width:100%;display:flex;gap:10px;align-items:center}
.st{font-size:12px;color:var(--g4)}

/* ---------- document preview ---------- */
.viewer{background:var(--g2);border-radius:12px;padding:18px;overflow:auto;max-height:70vh}
#docPage{width:794px;min-height:1123px;margin:0 auto;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.14)}
#docPage .dbody{padding:56px 47px 37px}
.dw p{margin:0}
.dw table{border-collapse:collapse;table-layout:fixed}
.dw img{max-width:100%}
.spin.big{width:34px;height:34px;border-width:4px}
.bar-ind{position:relative;height:6px;border-radius:6px;background:#EDE7FF;overflow:hidden}
.bar-ind>span{position:absolute;left:-40%;top:0;bottom:0;width:40%;border-radius:6px;
  background:linear-gradient(90deg,#8B55FE,#01DA8C);animation:ind 1.25s ease-in-out infinite}
@keyframes ind{0%{left:-40%}100%{left:100%}}
.pdfpage{overflow:hidden}
.pdfpage p,.pdfpage table,.pdfpage img,.pdfpage tr,.pdfpage td{break-inside:avoid;page-break-inside:avoid}
.pdf-c1 p{margin-top:0!important;margin-bottom:0!important}
.pdf-c1 .pdfzona>*{margin-top:2px!important;margin-bottom:2px!important}
.pdf-c2 td,.pdf-c2 th{padding-top:2px!important;padding-bottom:2px!important}
.pdf-c3 p,.pdf-c3 td,.pdf-c3 th{line-height:1.15!important}
 input.hl,textarea.hl{outline:3px solid #F3538E;background:#FFF3F8}
.pgbrk{height:0;break-before:page;page-break-before:always}
.anexoRe{width:1456px;height:817px;position:relative;background:#170F33;color:#fff;font-family:var(--font);overflow:hidden}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="mark">L</div><div>Generador de Renovaciones<small>Lapzo · Customer Success</small></div></div>
  <div class="steps" id="chips"></div>
</div>
<div class="bar"><div id="prog" style="width:12.5%"></div></div>
<div class="wrap"><div id="stage"></div></div>
<div class="foot"><div class="inner">
  <button class="btn" id="bBack">← Atrás</button>
  <span class="st" id="status"></span>
  <span class="sp"></span>
  <button class="btn gh" id="bReset">Cargar otro cliente</button>
  <button class="btn pri" id="bNext">Continuar →</button>
</div></div>
<div id="offscreen" style="position:fixed;left:-99999px;top:0"></div>
<script>
/* =========================================================================
   GENERADOR DE RENOVACIONES LAPZO
   Herramienta interna. El acuerdo cargado es la plantilla: se edita el XML
   original y de ese mismo XML se derivan la vista previa, el PDF y el DOCX.
   ========================================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------------- números y dinero ---------------- */
/* condición económica de un producto: no todo producto tiene precio */
const PRICING={
  priced:{l:'Con precio',tag:'same'},
  included:{l:'Incluido',tag:'p'},
  gift:{l:'Obsequio',tag:'new'},
  bonified:{l:'Bonificado',tag:'new'},
  nocost:{l:'Sin costo',tag:'p'},
  unknown:{l:'Por determinar',tag:'del'}
};
const RE_PRICING=[
  {st:'gift',     re:/obsequi|cortes[íi]a|regalo|gift/i},
  {st:'bonified', re:/bonificad|bonificaci[oó]n|bonus/i},
  {st:'nocost',   re:/sin\s+costo(\s+adicional)?|sin\s+cargo|no\s+cost|costo\s*\$?\s*0(\.00)?\b/i},
  {st:'included', re:/^\s*(incluid[oa]s?|incluye|included|en\s+el\s+paquete|dentro\s+del\s+plan)\b/i}
];
/* lee la condición económica del texto literal de la celda de precio */
function detectPricing(texto,tieneImporte){
  const t=String(texto||'').trim();
  if(tieneImporte)return {status:'priced',label:''};
  for(const r of RE_PRICING)if(r.re.test(t))return {status:r.st,label:t};
  if(/^\$?\s*0([.,]0{1,2})?\s*$/.test(t))return {status:'nocost',label:t||'Sin costo'};
  if(/incluid/i.test(t))return {status:'included',label:t};
  if(!t)return {status:'unknown',label:''};
  return {status:'unknown',label:t};
}
const esPagado=o=>!o||!o.pricing||o.pricing==='priced';
const pricingLabel=o=>{
  const st=(o&&o.pricing)||'priced';
  if(st==='priced')return '';
  return (o&&o.pricingLabel)||PRICING[st].l;
};
/* =========================================================================
   REGLA TAAS — dos productos de regalo exclusivos de Talent as a Service
   ========================================================================= */
const RE_TAAS=/\btaas\b|talent\s+as\s+a\s+service/i;
/* TaaS incluye la suite estándar EXCEPTO Cursos Bolt: ese sólo se palomea si se contrata */
const ANEXO_TAAS=['Capacitación','Desarrollo por competencias','Objetivos','Evaluaciones',
                  'Catálogo de cursos lapzo','Clima','Comunicación'];
const RE_BOLT=/cursos?\s*bolt/i;
const DCTO_PAGO_ANUAL=10;     // consideración comercial estándar: 10% por pago anual
const CONSIDERACIONES_STD=['Precios en pesos mexicanos','Precios más IVA*',
                           'Pago a 30 días mes vencido','Dcto del '+DCTO_PAGO_ANUAL+'% por pago anual'];
const REGALOS_TAAS=[
  {slot:1,nombre:'Gestión de personal',estado:'En construcción',label:'Incluido / Regalo',fijo:true}
];
const esTaaS=nombre=>RE_TAAS.test(String(nombre||''));
/* catálogo base: los productos del Anexo A, más un producto en blanco */
const CATALOGO_PRODUCTOS=[
  {k:'taas', n:'Talent as a Service (TaaS)', tipo:'TAAS'},
  {k:'cap',  n:'Capacitación',               tipo:'MODULO'},
  {k:'dxc',  n:'Desarrollo por Competencias',tipo:'MODULO'},
  {k:'obj',  n:'Objetivos',                  tipo:'MODULO'},
  {k:'eva',  n:'Evaluaciones',               tipo:'MODULO'},
  {k:'cat',  n:'Catálogo de cursos Lapzo',   tipo:'MODULO'},
  {k:'cli',  n:'Clima',                      tipo:'MODULO'},
  {k:'com',  n:'Comunicación',               tipo:'MODULO'},
  {k:'bolt', n:'Cursos Bolt',                tipo:'BOLT'},
  {k:'gp',   n:'Gestión de personal',        tipo:'GESTION', estado:'En construcción'},
  {k:'blank',n:'Producto en blanco',         tipo:'NUEVO'}
];
/* tipo normalizado del producto: la validación compara tipos, no texto visible */
function tipoProducto(p){
  if(!p)return 'OTRO';
  if(p.giftSlot)return 'REGALO';
  const t=(p.cur&&p.cur.nombre)||(p.base&&p.base.nombre)||'';
  const d=(p.cur&&p.cur.descripcion)||'';
  if(esTaaS(t)||esTaaS(d)||p.taasStd)return 'TAAS';
  if(RE_BOLT.test(t)||RE_BOLT.test(d))return 'BOLT';
  return 'OTRO:'+normN(t).split(' ').slice(0,3).join(' ');
}
const hayTaaS=()=>(S.prods||[]).some(p=>p.action!=='del'&&esTaaS(p.cur&&p.cur.nombre||p.base&&p.base.nombre));
const esRegalo=p=>!!(p&&p.giftSlot);
/* ¿el producto principal del acuerdo ANTERIOR era TaaS? */
const taasAnterior=()=>{
  const E=S.ext;
  if(!E)return false;
  return (E.prods||[]).some(p=>esTaaS(p.nombre)||esTaaS(p.descripcion)||(p.modulos||[]).some(esTaaS))
      || esTaaS(E.anexo&&E.anexo.plan||'');
};
/* evidencia explícita en el acuerdo anterior de que Cursos Bolt estaba contratado */
const boltAnterior=()=>{
  const E=S.ext;
  if(!E)return false;
  if((E.prods||[]).some(p=>RE_BOLT.test(p.nombre||'')||RE_BOLT.test(p.descripcion||'')||(p.modulos||[]).some(m=>RE_BOLT.test(m))))return true;
  const m=(E.anexo&&E.anexo.modulos||[]).find(x=>RE_BOLT.test(x.nombre||''));
  return !!(m&&anexoCellKind(m.valor)!=='no');
};
/* evidencia explícita de que Gestión de personal ya venía en la propuesta histórica */
const gestionAnterior=()=>{
  const E=S.ext;
  if(!E)return false;
  const re=/gesti[oó]n\s+de\s+personal/i;
  if((E.prods||[]).some(p=>re.test(p.nombre||'')||(p.modulos||[]).some(x=>re.test(x))))return true;
  const m=(E.anexo&&E.anexo.modulos||[]).find(x=>re.test(x.nombre||''));
  return !!(m&&anexoCellKind(m.valor)!=='no');
};
const boltContratado=()=>(S.prods||[]).some(p=>p.action!=='del'&&!esRegalo(p)&&(
  RE_BOLT.test(p.cur&&p.cur.nombre||'')||RE_BOLT.test(p.cur&&p.cur.descripcion||'')||
  (p.cur&&(p.cur.modulos||[]).some(m=>RE_BOLT.test(m)))));
const regaloTitulo=p=>{
  const n=(p.cur.nombre||'').trim();
  const e=(p.cur.giftEstado||'').trim();
  return n?(e?n+' ('+e+')':n):'';
};
/* qué representa el importe capturado, para no descontar dos veces */
const PRICE_TYPES={
  FINAL_CONTRACTED:'Valor final contratado (no se le aplica descuento)',
  BEFORE_ANNUAL_DISCOUNT:'Valor antes del descuento por pago anual',
  LIST_PRICE:'Precio lista (referencia comercial)'
};
const priceTypeOf=c=>(c&&c.priceType)||'FINAL_CONTRACTED';
const FACTOR_LISTA=1.10;      // precio lista = valor total pago anual + 10% (regla de presentación comercial)
const PCT_LISTA=Math.round((FACTOR_LISTA-1)*100);
const DURACION_ESTANDAR=12;   // regla de negocio: los acuerdos Lapzo duran 12 meses
const LAPZO_FIRMA={nombre:'Pedro Alfredo Sors Muñoz de Alba',cargo:'COO & CO-Fundador',
  id:'INE No. 1168807636',empresa:'DECASOL S.A. DE C.V.'};
const ANEXO_FILAS=['Número de Colaboradores','Capacitación','Desarrollo por competencias','Objetivos',
  'Evaluaciones','Catálogo de cursos lapzo','Clima','Comunicación','Cursos Bolt'];
const MESES_ES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaLarga(d){return d?(String(d.d).padStart(2,'0')+' de '+MESES_ES[(d.m||1)-1]+' de '+d.y):'';}
function parseNum(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  if(v==null)return null;
  let s=String(v).replace(/\s/g,'');
  const neg=/^\(.*\)$/.test(s)||/^-/.test(s);
  s=s.replace(/[^\d.,]/g,'');
  if(!s)return null;
  const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  const sep=Math.max(lc,ld);
  if(sep>=0){
    const decimals=s.length-sep-1;
    if(decimals>=1&&decimals<=2){                 // el último separador es decimal
      const dec=s[sep];
      s=s.slice(0,sep).replace(/[.,]/g,'')+'.'+s.slice(sep+1);
      void dec;
    }else{                                        // todos son separadores de miles
      s=s.replace(/[.,]/g,'');
    }
  }
  const n=parseFloat(s);
  if(isNaN(n))return null;
  return neg?-n:n;
}
function money(n,dec){
  if(n==null||isNaN(n))return '—';
  if(dec==null)dec=(typeof S!=='undefined'&&S&&S.roundInt)?0:2;
  const s=Math.abs(n).toFixed(dec).split('.');
  s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return (n<0?'-$':'$')+s.join(s[1]?'.':'');
}
/* replica el formato exacto del texto original ($90,000 -> $92,808 ; $222,000.00 -> $228,926.40) */
function fmtLikeMoney(raw,n){
  if(n==null||isNaN(n))return '';
  const r=String(raw==null?'':raw).trim();
  if(!r) return money(n);
  const pre=(r.match(/^[^\d]*/)||[''])[0];
  const dm=r.match(/[.,](\d{1,2})\s*$/);
  const dec=dm?dm[1].length:0;
  const euro=/\d\.\d{3}(?:[.,]|$)/.test(r);
  let parts=n.toFixed(dec).split('.');
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, euro?'.':',');

function parseDate(raw){
  if(!raw)return null;
  const s=String(raw).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return {y:+m[1],m:+m[2],d:+m[3]};
  m=s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);
  if(m){let y=+m[3]; if(y<100)y+=2000; return {d:+m[1],m:+m[2],y};}
  m=s.match(/(\d{1,2})\s*(?:de)?\s*([a-záéíóúñ]{3,})\s*(?:de|del)?\s*(\d{4})/i);
  if(m){
    const i=MES.findIndex(x=>x.startsWith(m[2].toLowerCase().slice(0,3)));
    if(i>=0)return {d:+m[1],m:i+1,y:+m[3]};
  }
  return null;
}
function fmtLikeDate(raw,dt){
  if(!dt)return '';
  const s=String(raw==null?'':raw);
  const m=s.match(/(\d{1,2})(\s*[\/\-.]\s*)(\d{1,2})(\s*[\/\-.]\s*)(\d{2,4})/);
  if(m)return pad2(dt.d)+m[2]+pad2(dt.m)+m[4]+String(dt.y);
  if(/\bde\b/i.test(s)&&/[a-z]{4,}/i.test(s))return dt.d+' de '+MES[dt.m-1]+' de '+dt.y;
  return pad2(dt.d)+' / '+pad2(dt.m)+' / '+dt.y;
}
const dISO=dt=>dt?dt.y+'-'+pad2(dt.m)+'-'+pad2(dt.d):'';
const dEs=dt=>dt?pad2(dt.d)+' / '+pad2(dt.m)+' / '+dt.y:'—';
function addMonths(dt,n){
  if(!dt)return null;
  const base=new Date(Date.UTC(dt.y,dt.m-1,1));
  base.setUTCMonth(base.getUTCMonth()+n);
  const y=base.getUTCFullYear(), m=base.getUTCMonth()+1;
  const last=new Date(Date.UTC(y,m,0)).getUTCDate();
  return {y,m,d:Math.min(dt.d,last)};
}
const dNum=dt=>dt?dt.y*10000+dt.m*100+dt.d:0;
const monthsBetween=(a,b)=>(!a||!b)?null:Math.round(((b.y-a.y)*12+(b.m-a.m))+(b.d-a.d)/30);

const tagsOf=(el,name,ns)=>Array.prototype.slice.call(el.getElementsByTagNameNS(ns||NS.w,name));
const firstOf=(el,name,ns)=>el?el.getElementsByTagNameNS(ns||NS.w,name)[0]||null:null;
function av(el,name,ns){
  if(!el)return null;

  if(v!==null&&v!==undefined&&v!=='')return v;
  const p=(ns===NS.r?'r:':'w:')+name;

/* texto plano de un nodo (w:t, saltos y tabs) */
function nodeText(el){
  let out='';
  (function walk(n){
    for(const c of Array.prototype.slice.call(n.childNodes)){
      if(c.nodeType===1){
        const ln=c.localName;
        if(ln==='t'||ln==='delText')out+=c.textContent;
        else if(ln==='br')out+='\n';
        else if(ln==='tab')out+='\t';
        else walk(c);
      }
    }
  })(el);
  return out;
}

function bodyBlocks(doc){
  const body=firstOf(doc.documentElement,'body');
  if(!body)return [];
  return Array.prototype.slice.call(body.childNodes).filter(n=>n.nodeType===1&&(n.localName==='p'||n.localName==='tbl'));
}

/* escribe texto en una celda conservando el formato del primer run */
function setCellText(tc,text){
  const ps=Array.prototype.slice.call(tc.childNodes).filter(n=>n.nodeType===1&&n.localName==='p');
  if(!ps.length)return;
  for(let i=1;i<ps.length;i++)tc.removeChild(ps[i]);
  setParaText(ps[0],text);
}
function setParaText(p,text){
  const runs=Array.prototype.slice.call(p.childNodes).filter(n=>n.nodeType===1&&n.localName==='r');
  if(!runs.length){
    const doc=p.ownerDocument;
    const r=doc.createElementNS(NS.w,'w:r');
    const t=doc.createElementNS(NS.w,'w:t');
    t.setAttribute('xml:space','preserve');t.textContent=text;
    r.appendChild(t);p.appendChild(r);return;
  }
  for(let i=1;i<runs.length;i++)p.removeChild(runs[i]);
  const r=runs[0];
  const ts=tagsOf(r,'t');
  const others=Array.prototype.slice.call(r.childNodes).filter(n=>n.nodeType===1&&(n.localName==='t'||n.localName==='br'||n.localName==='tab'));
  others.forEach(n=>{if(n!==ts[0])r.removeChild(n);});
  if(ts[0]){ts[0].setAttribute('xml:space','preserve');ts[0].textContent=text;}
  else{
    const t=r.ownerDocument.createElementNS(NS.w,'w:t');
    t.setAttribute('xml:space','preserve');t.textContent=text;r.appendChild(t);
  }
}

/* -------------------------------------------------------------------------
   Motor de reemplazos: respeta runs; sólo colapsa el párrafo cuando la
   cadena buscada está partida entre varios runs.
   ------------------------------------------------------------------------- */
function applyEdits(rootIn,edits,skipParas){
  const done=[];
  const root=rootIn.documentElement||rootIn;
  const paras=tagsOf(root,'p');
  const list=edits.filter(e=>e&&e.from&&e.to!=null&&String(e.from)!==String(e.to))
                  .sort((a,b)=>String(b.from).length-String(a.from).length);
  for(const p of paras){
    if(skipParas&&skipParas.has(p))continue;
    if(!tagsOf(p,'t').length)continue;
    for(const e of list){
      const ts=tagsOf(p,'t');
      const from=String(e.from), to=String(e.to);
      let hit=false;
      // 1) dentro de un solo w:t
      for(const t of ts){
        if(t.textContent.indexOf(from)>=0){
          t.setAttribute('xml:space','preserve');
          t.textContent=t.textContent.split(from).join(to);
          hit=true;
        }
      }
      // 2) partido entre runs -> colapsar párrafo
      if(!hit){
        const merged=ts.map(t=>t.textContent).join('');
        if(merged.indexOf(from)>=0){
          setParaText(p,merged.split(from).join(to));
          hit=true;
        }
      }
      if(hit)done.push({from,to,label:e.label||''});
    }
  }
  return done;
}

function fontStack(n){
  if(!n)return '';
  const f=String(n);
  if(/poppins/i.test(f))return "font-family:'Poppins','Century Gothic','Trebuchet MS',sans-serif;";
  if(/proxima|helvetica/i.test(f))return "font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;";
  if(/arial black/i.test(f))return "font-family:'Arial Black',Arial,sans-serif;";
  return "font-family:'"+f.replace(/'/g,'')+"',sans-serif;";
}
let RCTX={defs:{},counters:{}};
function romanize(n,lower){
  const T=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out='';T.forEach(([v,c])=>{while(n>=v){out+=c;n-=v;}});
  return lower?out.toLowerCase():out;
}
function numMarker(numId,ilvl){
  const d=(RCTX.defs[numId]||{})[ilvl];
  if(!d)return '&bull;';
  if(d.fmt==='bullet')return esc((d.text||'\u2022').slice(0,1));
  const key=numId+':'+ilvl;
  RCTX.counters[key]=(RCTX.counters[key]||(d.start||1)-1)+1;
  const n=RCTX.counters[key];
  let v=String(n);
  if(d.fmt==='upperLetter')v=String.fromCharCode(65+((n-1)%26));
  else if(d.fmt==='lowerLetter')v=String.fromCharCode(97+((n-1)%26));
  else if(d.fmt==='upperRoman')v=romanize(n,false);
  else if(d.fmt==='lowerRoman')v=romanize(n,true);
  return esc((d.text||'%1.').replace('%'+(ilvl+1),v));
}
function parseNumbering(xml){

}
function rprCss(rPr){

  const b=g('b'),i=g('i'),u=g('u'),st=g('strike'),col=g('color'),sz=g('sz'),rf=g('rFonts'),hl=g('highlight');
  if(b&&onFlag(av(b,'val')))c+='font-weight:700;';

function borderCss(side,el){

function renderRun(r,media){

    else if(c.localName==='br')out+=(av(c,'type')==='page'?'<div class="pgbrk"></div>':'<br>');
    else if(c.localName==='tab')out+='<span style="display:inline-block;width:28px"></span>';

        const oy=pv?parseFloat((firstOf(pv,'posOffset',NS.wp)||{textContent:0}).textContent)||0:0;
        pos='position:absolute;left:'+Math.round(ox/9525)+'px;top:'+Math.round(oy/9525)+'px;';
      }
      const ext=firstOf(c,'extent',NS.wp);

      const m=rid&&media?media[rid]:null;

function renderP(p,media){

    }
    if(bdr){['top','bottom','left','right'].forEach(s=>{css+=borderCss(s,firstOf(bdr,s));});}

  }

}
function renderTbl(tbl,media){

const MIMES={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',emf:'image/emf',wmf:'image/wmf',svg:'image/svg+xml'};
function b64(u8){
  let s='';const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH)s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return btoa(s);
}
async function loadDocx(ab,name){
  const zip=await JSZip.loadAsync(ab);

  const rels={};

    rels[r.getAttribute('Id')]={type:r.getAttribute('Type'),target:r.getAttribute('Target')};
  });

    const u8=await f.async('uint8array');
    const ext=(path.split('.').pop()||'png').toLowerCase();
    const mime=MIMES[ext]||'image/png';
    const raw=b64(u8);

    bodyImgs.push(Object.assign({rid:id},media[id]));

  for(const id of hdrIds){
    const path='word/'+(rels[id].target||'').replace(/^\.\//,'');
    const f=zip.file(path);if(!f)continue;
    const xml=await f.async('string');
    if(!/blip/.test(xml))continue;
    const hrelsF=zip.file(path.replace('word/','word/_rels/')+'.rels');
    const hmedia={};
    if(hrelsF){
      const hx=await hrelsF.async('string');
      for(const r of Array.prototype.slice.call(parseXml(hx).querySelectorAll('Relationship'))){
        const t=r.getAttribute('Target')||'';
        if(!/media\//.test(t))continue;
        const p2='word/'+t.replace(/^\.\//,'');
        const ff=zip.file(p2);if(!ff)continue;
        const u8=await ff.async('uint8array');
        const ext=(p2.split('.').pop()||'png').toLowerCase();
        const mm=MIMES[ext]||'image/png';
        hmedia[r.getAttribute('Id')]={url:'data:'+mm+';base64,'+b64(u8)};
        headerImgs.push({rid:r.getAttribute('Id'),url:hmedia[r.getAttribute('Id')].url,path:p2,mime:mm,ext});
      }
    }
    const hdoc=parseXml(xml);
    // posicion y tamaño de cada imagen del encabezado (para saber cuál es la de la izquierda)
    tagsOf(hdoc.documentElement,'drawing').forEach(dr=>{
      const blip=firstOf(dr,'blip',NS.a);
      const rid=blip?(blip.getAttribute('r:embed')||av(blip,'embed',NS.r)):null;
      if(!rid)return;

      const anchor=firstOf(dr,'anchor',NS.wp);
      const ph=anchor?firstOf(anchor,'positionH',NS.wp):null;
      const off=ph?parseFloat((firstOf(ph,'posOffset',NS.wp)||{textContent:'0'}).textContent)||0:0;
      const ext=firstOf(dr,'extent',NS.wp)||firstOf(dr,'ext',NS.a);
      inf.x=off;
      inf.cx=ext?parseFloat(av(ext,'cx')||'0'):0;
      inf.cy=ext?parseFloat(av(ext,'cy')||'0'):0;

const TERMINOS_CONTRATO=['acuerdo','cliente','empresa','raz','rfc','tax id','servicio','renovaci','producto',
  'licencia','valor','pago','vigencia','domicilio','firma','anexo','iva'];
/* evalua si el texto nativo de una pagina alcanza para interpretarla */
function evalTextoPagina(txt){
  const t=String(txt||'').replace(/\[P[áa]gina\s*\d+\]/gi,'').trim();
  const chars=t.length;
  const words=t.split(/\s+/).filter(w=>w.length>1).length;
  const legibles=(t.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ0-9.,:%$@\/()\-\s]/g)||[]).length;
  const ratio=chars?legibles/chars:0;
  const low=t.toLowerCase();
  const terms=TERMINOS_CONTRATO.filter(k=>low.indexOf(k)>=0).length;
  const suficiente=chars>=180&&words>=30&&ratio>=0.85&&terms>=2;
  return {chars,words,ratio:Math.round(ratio*100)/100,terms,suficiente};
}
/* ---------- OCR (se carga solo si alguna pagina lo necesita) ---------- */
let TESSW=null;
const OCR_CFG=[
  {workerPath:'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/worker.min.js',
   corePath:'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js-core/5.0.0/'},
  {}
];
async function ensureTesseract(){
  if(window.Tesseract)return window.Tesseract;
  await new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js';
    sc.onload=res;sc.onerror=()=>rej(new Error('no se pudo cargar el motor OCR'));
    document.head.appendChild(sc);
  });
  if(!window.Tesseract)throw new Error('motor OCR no disponible');
  return window.Tesseract;
}
async function ocrCanvas(cv,onProg){
  const T=await ensureTesseract();
  if(!TESSW){
    let err=null;
    for(const cfg of OCR_CFG){
      try{
        TESSW=await T.createWorker('spa+eng',1,Object.assign({logger:m=>{
          if(onProg&&m.status==='recognizing text')onProg(m.progress);
        }},cfg));
        err=null;break;
      }catch(e){err=e;}
    }
    if(!TESSW)throw err||new Error('OCR no disponible');
  }
  const r=await TESSW.recognize(cv);
  const lineas=((r.data&&r.data.lines)||[]).map(l=>String(l.text||'').replace(/\s+/g,' ').trim()).filter(Boolean);
  const items=[];
  ((r.data&&r.data.words)||[]).forEach(w=>{
    const t=String(w.text||'').trim();
    if(!t)return;
    const b=w.bbox||{};
    items.push({text:t,x0:b.x0||0,x1:b.x1||0,y0:b.y0||0,y1:b.y1||0,conf:(w.confidence||0)/100});
  });
  return {text:lineas.join('\n'),conf:(r.data&&r.data.confidence)||0,items};
}
async function loadPdf(ab,name){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(ab.slice(0))}).promise;
  let text='',pages=[];
  const pageInfo=[],warnings=[],items=[];
  for(let i=1;i<=pdf.numPages;i++){
    say('Leyendo página '+i+' de '+pdf.numPages+'…',true);
    const pg=await pdf.getPage(i);
    const tc=await pg.getTextContent();
    let last=null,line='';
    const lines=[];
    const vp1=pg.getViewport({scale:1});
    for(const it of tc.items){
      const y=Math.round(it.transform[5]);
      if(last!==null&&Math.abs(y-last)>3){lines.push(line.trim());line='';}
      const txt=String(it.str||'');
      if(txt.trim()){
        const x0=it.transform[4],w=it.width||0,hh=it.height||10;
        items.push({text:txt.trim(),page:i,x0,x1:x0+w,y:vp1.height-y,h:hh,conf:1,fuente:'texto'});
      }
      line+=txt+(it.hasEOL?' ':'');
      last=y;
    }
    if(line.trim())lines.push(line.trim());
    let pageText=lines.filter(Boolean).join('\n');
    const q=evalTextoPagina(pageText);
    const vp=pg.getViewport({scale:q.suficiente?1.6:2.4});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    let fuente='texto';
    if(!q.suficiente){
      try{
        say('Página '+i+' de '+pdf.numPages+': texto insuficiente, aplicando OCR…',true);
        const o=await ocrCanvas(cv,pr=>say('OCR página '+i+' de '+pdf.numPages+' · '+Math.round(pr*100)+'%',true));
        if(evalTextoPagina(o.text).chars>q.chars){
          pageText=o.text;fuente='ocr';
          const k=vp.width?(vp.width/(vp.width)):1;
          (o.items||[]).forEach(w=>{
            items.push({text:w.text,page:i,x0:w.x0,x1:w.x1,y:w.y0,h:Math.max(6,w.y1-w.y0),conf:w.conf,fuente:'ocr'});
          });
        }
        else fuente=q.chars?'texto':'ilegible';
      }catch(e){
        fuente=q.chars?'texto':'ilegible';
        warnings.push('Página '+i+': el texto es insuficiente y no fue posible ejecutar OCR ('+e.message+'). '+
          (q.chars?'Se usa el poco texto disponible.':'No fue posible leer correctamente esta página.'));
      }
      if(fuente==='ilegible'&&!warnings.some(w=>w.indexOf('Página '+i+':')===0))
        warnings.push('Página '+i+': no fue posible leer correctamente esta página (sin texto ni resultado de OCR).');
    }
    pageInfo.push({n:i,fuente,chars:evalTextoPagina(pageText).chars,calidadNativa:q});
    text+='\n[Página '+i+']\n'+pageText;
    pages.push(cv.toDataURL('image/jpeg',.82));
  }
  const conContenido=pageInfo.filter(p=>p.chars>0);
  const conOcr=pageInfo.filter(p=>p.fuente==='ocr').length;
  const docType=conOcr===0?'digital':(conOcr>=conContenido.length?'scanned':'mixed');
  if(conOcr)warnings.push('Se aplicó OCR en '+conOcr+' página(s) ('+pageInfo.filter(p=>p.fuente==='ocr').map(p=>p.n).join(', ')+'). Revisa los datos de esas páginas: el reconocimiento puede introducir errores de escritura.');
  say('Interpretando información contractual…',true);
  /* ---- DIAGNÓSTICO DE LECTURA (temporal) ---- */
  const fullText=text;
  window.fullText=fullText;
  if(typeof DEBUG!=='undefined'&&DEBUG){
    console.log("=== PRUEBA PDF ===");
    console.log("Caracteres extraídos:", fullText?.length || 0);
    console.log("Texto extraído:");
    console.log(fullText);
    console.log("=== FIN PRUEBA PDF ===");
  }
  return {kind:'pdf',name,ab,text,pages,numPages:pdf.numPages,pageInfo,docType,warnings,items,
          diag:{pages:pdf.numPages,chars:fullText.length,docType,pageInfo},
          blocks:[],media:{},bodyImgs:[],b64:b64(new Uint8Array(ab.slice(0)))};
}

function separarZonasFirma(lines,fuentePorLinea){
  const datos=[],firmas=[],avisos=[];
  let zona=false,zonaOcr=false;
  lines.forEach((l,i)=>{
    const fuente=(fuentePorLinea&&fuentePorLinea[i])||'texto';
    if(RE_ZONA_FIRMA.test(l)){
      zona=true;zonaOcr=(fuente==='ocr');
      // la linea previa suele ser la razon social del firmante
      const prev=lines[i-1]||'';
      if(!zonaOcr&&/s\.?\s?a\.?\s*de\s*c\.?\s?v\.?|s\.a\.s|inc\.|ltda/i.test(prev))firmas.push(prev);
      if(zonaOcr)avisos.push('Zona de firma en página con OCR: se ignoró por completo para no tomar datos manuscritos.');
      return;
    }
    if(zona&&RE_FIN_ZONA.test(l.trim())){zona=false;zonaOcr=false;}
    if(!zona){datos.push(l);return;}
    // dentro de zona de firma
    if(zonaOcr)return;                       // nada de OCR en zonas de firma
    if(RE_ETIQ_FIRMA.test(l)){firmas.push(l);return;}
    if(/s\.?\s?a\.?\s*de\s*c\.?\s?v\.?|s\.a\.s|inc\.|ltda/i.test(l)){firmas.push(l);return;}
    // resto de la zona (rubricas transcritas, fechas de firma, lineas ____) se descarta
  });

/* devuelve las lineas entre dos marcadores (tolera dos puntos, mayusculas y espacios) */
function extractBetween(lines,startRe,endRe,incluirLinea){

    for(let k=i+1;k<lines.length;k++){if(endRe.test(lines[k])){j=k;break;}}
  }
  const out=lines.slice(i+1,j);
  if(incluirLinea)out.unshift(lines[i]);
  return out;

function labelValue(lines,labelRe,opts){

    if(!labelRe.test(lines[i]))continue;
    let rest=lines[i].replace(labelRe,'').replace(/^\s*:?\s*/,'').trim();
    if(o.cut)rest=rest.split(o.cut)[0].trim();
    if(val(rest))return val(rest);
    const sig=lines[i+1]||'';
    if(o.noSiguiente)return '';
    if(val(sig)&&!/^[A-D]\.\s|^(nombre|tel[eé]fono|cargo|email|correo|domicilio|denominaci)/i.test(sig))return val(sig);
    return '';
  }

    const lineas=agruparLineas(porPagina[pag]);

      const L=lineas[li];
      const cols=[];

        let best=null;

            const frag=L.items.slice(a,b+1).map(i=>i.text).join(' ');

const COL_DEFS=[

  {key:'duration',re:/plazo|duraci[oó]n|(^|\s)\(?meses\)?(\s|$)|vigencia\s*\(meses\)/i},
  {key:'licenses',re:/cantidad\s+de\s+licencias|n[uú]mero\s+de\s+licencias|no\.?\s*(de\s*)?(licencias|usuarios)|licencias|usuarios|colaboradores/i},
  {key:'price',   re:/valor\s+total|valor|precio|importe|monto|inversi[oó]n/i}

const RE_MONEY=/^\s*(\$|mxn|usd|cop|eur)?\s?[\d][\d.,]*\s*(mxn|usd|cop|eur)?\s*(\+?\s*iva)?\s*$/i;
const RE_INT=/^\s*\d{1,4}\s*(meses|mes|licencias?|usuarios?|colaboradores?)?\s*$/i;

function detectTableHeaders(sec){
  // caso A: todos los encabezados en la misma linea
  for(const l of sec){
    const pos=[];
    COL_DEFS.forEach(c=>{
      const m=l.match(c.re);
      if(m&&m.index!=null&&!pos.some(x=>x.key===c.key))pos.push({key:c.key,idx:m.index,label:m[0].trim()});
    });

      pos.sort((a,b)=>a.idx-b.idx);
      return {headers:pos.map(x=>x.key),labels:pos.map(x=>x.label),desde:sec.indexOf(l)+1,modo:'linea'};
    }

  // caso B: un encabezado por linea (tablas destruidas por OCR)
  for(let i=0;i<sec.length;i++){
    const hs=[],lb=[];
    let k=i;
    while(k<sec.length&&sec[k].length<50){
      const hit=COL_DEFS.find(c=>c.re.test(sec[k])&&!hs.includes(c.key));
      const soloEtiqueta=hit&&!/\d/.test(sec[k].replace(/\(meses\)|\(mxn\)|\(usd\)|\(plan\)/gi,''));
      if(!hit||!soloEtiqueta)break;
      hs.push(hit.key);lb.push(sec[k].trim());k++;
    }

/* separa una linea en tokens: importes, enteros sueltos y texto */
function tokensDeLinea(l){
  const out=[];
  let resto=l.trim();
  if(!resto)return out;
  const tieneMoney=/\$\s?[\d]|\d[\d.,]*\s*(mxn|usd|cop|eur)/i.test(resto);
  const tieneLic=RE_LIC_TXT.test(resto);
  const soloNumero=/^\d{1,4}\s*(meses|mes|licencias?|usuarios?|colaboradores?)?$/i.test(resto);
  const separadores=/[|\t]/.test(resto);
  // una línea descriptiva («2 Evaluaciones 360°», «Plataforma Lapzo») no se trocea en números
  if(!tieneMoney&&!tieneLic&&!soloNumero&&!separadores)return [resto];
  const reTok=/(\$\s?[\d][\d.,]*(?:\s*(?:mxn|usd|cop|eur))?(?:\s*\+?\s*iva)?)|((?:hasta|desde|m[áa]ximo)\s+\d+\s*(?:colaboradores?|usuarios?|licencias?)?)|(\b\d{1,4}\s*[-–]\s*\d{1,4}\b)|(\b\d{1,4}\s*(?:meses|licencias?|usuarios?|colaboradores?)\b)|(\b\d{1,4}\b)/gi;
  let last=0,m;
  while((m=reTok.exec(resto))){
    const txt=resto.slice(last,m.index).trim();
    if(txt)out.push(txt);
    out.push(m[0].trim());
    last=m.index+m[0].length;
  }
  const cola=resto.slice(last).trim();
  if(cola)out.push(cola);
  return out.length?out:[resto];
}

      priceRaw:priceLimpio,

      currency:(String(row.price||'').match(/mxn|usd|cop|eur/i)||[null])[0],

function parseLogoPermissions(lines){
  const o={web:null,redes:null};
  lines.forEach((l,i)=>{
    if(!/autorizo\s+el\s+uso\s+del\s+logo/i.test(l))return;
    // el contexto termina antes de la siguiente autorizacion para no confundir web con redes
    let ctx=l;
    for(let k=i+1;k<=i+2&&k<lines.length;k++){
      if(/autorizo\s+el\s+uso\s+del\s+logo/i.test(lines[k]))break;
      ctx+=' '+lines[k];
    }
    const tipo=/redes\s+sociales/i.test(l)?'redes':(/p[áa]gina\s+web|contenido\s+interno|ventas/i.test(l)?'web':
               (/redes\s+sociales/i.test(ctx)?'redes':(/p[áa]gina\s+web|contenido\s+interno|ventas/i.test(ctx)?'web':'')));
    const si=/\(\s*([xX✓•])\s*\)\s*S[ÍI]/.test(ctx);
    const no=/\(\s*([xX✓•])\s*\)\s*NO/i.test(ctx);
    let v=null;
    if(si&&!no)v=true;else if(no&&!si)v=false;else if(si&&no)v=true;
    if(tipo==='redes')o.redes=v;
    else if(tipo==='web')o.web=v;
  });
  return o;
}

function parseAgreement(fullText,meta){
  const M=meta||{};
  const todasLineas=pdfLines(fullText);
  const fuentes=fuenteDeLineas(fullText,M.pageInfo);
  const Z=separarZonasFirma(todasLineas,fuentes);
  const lines=Z.datos;
  const S1=seccionesAcuerdo(lines);
  const cli=S1.cliente.length?S1.cliente:lines;
  const emp=parseCompanyData(cli);
  const resp=parseProjectResponsible(cli);
  const fact=parseBillingContact(cli);
  const vig=parseContractDates(S1.servicio.length?S1.servicio:lines);
  const prods=parseProducts(S1.productos,M.items);
  const cond=parseCommercialTerms(lines,S1.pedido.length?S1.pedido:lines);
  const firmas=parseSignatories(Z.firmas);
  const logo=parseLogoPermissions(lines);
  const p=prods[0]||{};
  const warnings=(M.warnings||[]).concat(Z.avisos);
  if(!emp.razon)warnings.push('No fue posible identificar la razón social.');
  if(!vig.renovRaw)warnings.push('No fue posible identificar la fecha de renovación.');
  if(!prods.length)warnings.push('No fue posible identificar los productos contratados.');
  if(!firmas.firmaCliente.nombre)warnings.push('No se obtuvo el firmante del cliente de texto impreso confiable.');
  const debug={
    document:{pages:M.pages||null,type:M.docType||'digital',pageInfo:M.pageInfo||[],lineasFirmaIgnoradas:todasLineas.length-lines.length},
    warnings,
    company:{commercialName:emp.nombre,legalName:emp.razon,taxId:emp.taxid,country:emp.pais,address:emp.domicilio},
    projectResponsible:{name:resp.nombre,phone:resp.tel,position:resp.cargo,email:resp.email},
    billingContact:{name:fact.nombre,email:fact.email},
    contract:{startDate:vig.inicioRaw,renewalDate:vig.renovRaw,duration:vig.mesesRaw},
    commercial:{product:p.nombre||'',licenses:p.licenciasRaw||'',listPrice:p.lista||null,
      discountPercent:p.descVal||0,finalPrice:p.final||null,included:p.modulos||[],
      total:cond.total,paymentTerms:cond.formaRaw},
    contacts:{projectResponsible:{name:resp.nombre,phone:resp.tel,position:resp.cargo,email:resp.email},
              billingContact:{name:fact.nombre,phone:fact.tel,email:fact.email}},
    representatives:{client:firmas.firmaCliente,lapzo:firmas.firmaLapzo},
    signatories:firmas,logo,lines:lines.length,
    trace:(typeof S!=='undefined'&&S&&S.trace)||{}
  };
  return {emp,per:{responsable:resp,factura:fact,firmaCliente:firmas.firmaCliente,firmaLapzo:firmas.firmaLapzo},
    vig,prods,cond,logo,warnings,debug};
}

function heurExtract(src){
  const E=emptyExt();
  if(src.kind!=='docx'){
    if(!src.text||!src.text.trim())return E;
    const P=parseAgreement(src.text,{pages:src.numPages,docType:src.docType,pageInfo:src.pageInfo,warnings:src.warnings,items:src.items});
    S.parsed=P.debug;
    E.emp=P.emp;
    E.per.responsable=P.per.responsable;E.per.factura=P.per.factura;
    E.per.firmaCliente=P.per.firmaCliente;E.per.firmaLapzo=P.per.firmaLapzo;
    E.vig=P.vig;E.prods=P.prods;E.cond=P.cond;E.logo=P.logo;
    if(!E.per.firmaCliente.empresa&&E.emp.razon)E.per.firmaCliente.empresa=E.emp.razon;
    if(!E.per.firmaCliente.nombre&&E.per.responsable.nombre){
      E.per.firmaCliente={nombre:E.per.responsable.nombre,cargo:E.per.responsable.cargo,id:'',empresa:E.emp.razon||''};
    }
    E.anexo.colaboradores=(E.prods[0]||{}).colaboradores||'';
    E.cond.nPagos=E.cond.pagos.length||1;
    E.warnings=P.warnings;
    if(DEBUG){console.log("=== PARSED AGREEMENT ===");console.log(P.debug);}
    return E;
  }
  let sec='';
  for(const b of src.blocks){
    if(b.kind!=='tbl')continue;
    const rows=b.rows;
    const head=(rows[0]||[]).map(norm);
    // ---- tabla de productos
    if(head.some(h=>/producto/.test(h))&&head.some(h=>/valor|precio/.test(h))){
      const col=k=>head.findIndex(h=>k.test(h));
      const cN=col(/producto/),cP=col(/plazo/),cL=col(/licencia/),cV=col(/valor|precio/);
      for(let i=1;i<rows.length;i++){
        const r=rows[i];
        const nm=(cN>=0?r[cN]:r[0])||'';
        if(!norm(nm))continue;
        const vRaw=(cV>=0?r[cV]:r[r.length-1])||'';
        const amounts=(vRaw.match(/\$?\s?[\d][\d.,]*/g)||[]).map(x=>x.trim()).filter(x=>parseNum(x)!=null&&parseNum(x)>0);
        let listaRaw=amounts[0]||'', finalRaw=amounts[amounts.length-1]||'';
        const lista=parseNum(listaRaw), fin=parseNum(finalRaw);
        let dTipo='pct',dVal=0;
        // sólo cuenta el descuento escrito explícitamente en el acuerdo
        const pctTxt=(String(vRaw||'')+' '+String(nm||'')).match(/(\d{1,2}(?:\.\d+)?)\s*%\s*(de\s+)?(dcto|descuento|desc\b|off)?/i);
        if(pctTxt&&/dcto|descuento|desc\b|off|%/i.test(pctTxt[0])&&/dcto|descuento|desc\b|off/i.test(String(vRaw||'')+' '+String(nm||'')))dVal=+pctTxt[1];
        const pr=detectPricing(vRaw,amounts.length>0);
        E.prods.push({pricing:pr.status,pricingLabel:pr.label,nombre:nm.trim(),plan:'',descripcion:'',modulos:[],
          licenciasRaw:(cL>=0?r[cL]:'')||'',colaboradores:'',
          plazoRaw:(cP>=0?r[cP]:'')||'',listaRaw,lista,descTipo:dTipo,descVal:dVal,finalRaw,final:fin,
          valorCellRaw:vRaw.trim()});
      }
      continue;
    }
    // ---- tabla de pagos
    if(head.some(h=>/fecha/.test(h))&&head.some(h=>/valor|monto|importe/.test(h))&&rows.length>1&&!head.some(h=>/servicio/.test(h))){
      for(let i=1;i<rows.length;i++){
        const f=rows[i][0]||'',v=rows[i][1]||'';
        if(!parseDate(f)&&parseNum(v)==null)continue;
        E.cond.pagos.push({fechaRaw:f.trim(),montoRaw:v.trim(),monto:parseNum(v)});
      }
      continue;
    }
    // ---- tabla de vigencia
    if(rows.some(r=>/inicio de contrato|inicio del servicio/.test(norm(r[0]||'')))){
      for(const r of rows){
        const k=norm(r[0]||''),v=(r[1]||'').trim();
        if(/inicio de contrato|inicio del servicio/.test(k))E.vig.inicioRaw=v;
        else if(/renovaci/.test(k))E.vig.renovRaw=v;
        else if(/duraci/.test(k)){E.vig.mesesRaw=v;const n=parseNum(v);if(n)E.vig.meses=n;}
      }
      continue;
    }
    // ---- tabla de datos del cliente (label/value + filas de sección)
    for(const r of rows){
      const cells=r.filter(c=>String(c).trim()!=='');
      if(cells.length===1){sec=norm(cells[0]);continue;}
      const k=norm(r[0]||'');
      const v=(r[1]||'').trim();
      const k2=norm(r[2]||''),v2=(r[3]||'').trim();
      const put=(kk,vv)=>{
        if(!vv)return;
        if(/nombre de la empresa|nombre comercial/.test(kk))E.emp.nombre=vv;
        else if(/razón social|razon social|denominaci/.test(kk))E.emp.razon=vv;
        else if(/rfc|tax id|nit|ruc|rut/.test(kk))E.emp.taxid=vv;
        else if(/^pa[íi]s/.test(kk))E.emp.pais=vv;
        else if(/domicilio/.test(kk))E.emp.domicilio=vv;
        else{
          const tgt=/factura|tesorer/.test(sec)?E.per.factura:E.per.responsable;
          if(/nombre/.test(kk))tgt.nombre=vv;
          else if(/tel/.test(kk))tgt.tel=vv;
          else if(/cargo|puesto/.test(kk))tgt.cargo=vv;
          else if(/email|correo/.test(kk))tgt.email=vv;
        }
      };
      put(k,v);put(k2,v2);
    }
  }
  // ---- párrafos
  const ps=src.blocks.filter(b=>b.kind==='p').map(b=>b.text);
  for(let i=0;i<ps.length;i++){
    const t=ps[i];
    let m=t.match(/valor total del servicio[^$]*(\$\s?[\d][\d.,]*)/i);
    if(m){E.cond.totalRaw=m[1].replace(/\s/g,'');E.cond.total=parseNum(m[1]);}
    m=t.match(/dentro de los pr[óo]ximos\s+(\d+)\s+d[íi]as/i);
    if(m){E.cond.dias=+m[1];E.cond.diasRaw=m[0];}
    if(/autorizo el uso del logo/i.test(t)){
      const yes=/\(\s*[xX✓]\s*\)\s*S[ÍI]/i.test(t);
      if(/p[áa]gina web|contenido interno de ventas/i.test(t))E.logo.web=yes;
      else if(/redes sociales/i.test(t))E.logo.redes=yes;
    }
    if(/^nombre\s*:/i.test(t)){
      const nombre=t.replace(/^nombre\s*:\s*/i,'').trim();
      const cargo=(ps[i+1]||'').match(/^cargo\s*:\s*(.*)$/i);
      const idm=(ps[i+2]||'').match(/^id\s*:\s*(.*)$/i);
      let empresa='';
      for(let k=i-1;k>=Math.max(0,i-8);k--){
        if(/s\.?a\.?\s*de\s*c\.?v\.?|s\.a\.s|inc\.|ltda/i.test(ps[k])&&!/^firma/i.test(ps[k])){empresa=ps[k].trim();break;}
      }
      const isLapzo=/decasol|lapzo/i.test(empresa);
      const obj={nombre,cargo:cargo?cargo[1].trim():'',id:idm?idm[1].trim():'',empresa};
      if(isLapzo)E.per.firmaLapzo=obj;else E.per.firmaCliente=obj;
    }
  }
  if(!E.per.firmaCliente.empresa&&E.emp.razon)E.per.firmaCliente.empresa=E.emp.razon;
  E.cond.nPagos=E.cond.pagos.length||1;
  return E;
}

async function callClaude(content,maxTokens){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTokens||8000,messages:[{role:'user',content}]})
  });
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||'API error');
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function jsonFrom(txt){
  let t=String(txt||'').replace(/```json/gi,'').replace(/```/g,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('sin JSON');
  return JSON.parse(t.slice(a,b+1));
}
async function aiExtract(src){
  const content=[];
  if(src.kind==='pdf'){
    content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:src.b64}});
    content.push({type:'text',text:EXTRACT_PROMPT+'(el documento PDF esta adjunto)'});
  }else{
    content.push({type:'text',text:EXTRACT_PROMPT+src.text.slice(0,60000)});
    const imgs=(src.bodyImgs||[]).filter(m=>/png|jpe?g/.test(m.ext)&&m.bytes>15000).slice(0,3);
    if(imgs.length){
      content.push({type:'text',text:'Imagenes incrustadas en el documento (normalmente el Anexo A / propuesta comercial):'});
      imgs.forEach(m=>content.push({type:'image',source:{type:'base64',media_type:m.mime==='image/jpeg'?'image/jpeg':'image/png',data:m.b64}}));
    }
  }
  const txt=await callClaude(content,8000);
  return jsonFrom(txt);
}
function mergeExt(H,A){

  if(A.anexo){

  // productos: la tabla manda en cifras; la IA aporta plan, descripción, módulos y colaboradores
  if(Array.isArray(A.prods)){
    if(!E.prods.length){
      E.prods=A.prods.map(p=>({
        nombre:p.nombre||'',plan:p.plan||'',descripcion:p.descripcion||'',modulos:p.modulos||[],
        licenciasRaw:p.licenciasRaw||'',colaboradores:p.colaboradores||'',plazoRaw:p.plazoRaw||'',
        listaRaw:p.listaRaw||'',lista:parseNum(p.listaRaw),descTipo:'pct',
        descVal:(parseNum(p.listaRaw)&&parseNum(p.finalRaw)&&parseNum(p.finalRaw)<parseNum(p.listaRaw))

        finalRaw:p.finalRaw||'',final:parseNum(p.finalRaw),valorCellRaw:''
      }));
    }else{
      E.prods.forEach(p=>{
        const a=A.prods.find(x=>norm(x.nombre).slice(0,14)&&norm(p.nombre).indexOf(norm(x.nombre).slice(0,14))>=0)
             ||A.prods.find(x=>norm(x.nombre)&&norm(x.nombre).indexOf(norm(p.nombre).slice(0,14))>=0);
        if(!a)return;

  if(!S.logoCli)S.logoCli={url:null,name:'',mime:'',w:0,h:0,omitir:false,error:''};
  recalcPagos(true);
  syncRegalosTaaS();
  syncAnexo();
  S.issues=buildIssues();
}

/* =========================================================================
   ESTADO POR BLOQUE — original vs borrador vs confirmado
   ========================================================================= */
const BLOQUES={
  emp:{t:'Datos de la empresa',
       get:()=>JSON.parse(JSON.stringify(S.ext.emp)),
       set:d=>{S.ext.emp=Object.assign({},S.ext.emp,d);}},
  per:{t:'Personas y contactos',
       get:()=>JSON.parse(JSON.stringify({responsable:S.ext.per.responsable,factura:S.ext.per.factura,firmaCliente:S.ext.per.firmaCliente})),
       set:d=>{S.ext.per.responsable=d.responsable;S.ext.per.factura=d.factura;S.ext.per.firmaCliente=d.firmaCliente;}},

  cond:{t:'Vigencia y condiciones comerciales',
       get:()=>JSON.parse(JSON.stringify({vig:S.ext.vig,cond:S.ext.cond,
              renewalInicio:S.ren?dISO(S.ren.inicio):'',
              renewalMeses:S.ren?(S.ren.meses||DURACION_ESTANDAR):DURACION_ESTANDAR})),
       set:d=>{
         S.ext.vig=d.vig;S.ext.cond=d.cond;
         const m=Math.max(1,parseInt(d.renewalMeses,10)||DURACION_ESTANDAR);
         const ini=parseDate(d.renewalInicio)||S.ren.inicio;
         if(m!==S.ren.meses)S.ren.mesesSource='user';
         S.ren.meses=m;
         if(ini)S.ren.inicio=ini;
         if(S.ren.inicio)S.ren.renov=addMonths(S.ren.inicio,m);
       }},
  anexo:{t:'Propuesta comercial (Anexo A)',
       get:()=>JSON.parse(JSON.stringify({anexo:S.ext.anexo})),
       set:d=>{S.ext.anexo=d.anexo;}}
};
const blkOf=k=>(S.blocks&&S.blocks[k])||{status:'pending',draft:null};
const blkStatus=k=>blkOf(k).status;
const blkDirty=k=>{const b=blkOf(k);return b.status==='editing'&&b.draft&&JSON.stringify(b.draft)!==JSON.stringify(BLOQUES[k].get());};
function hayCambiosSinGuardar(){return !!S.blocks&&Object.keys(BLOQUES).some(blkDirty);}
function blkEditar(k){
  const b=S.blocks[k];
  if(b.status!=='editing')b.prev=b.status;
  b.draft=BLOQUES[k].get();      // se copian los valores ACTUALES, no los originales del PDF
  b.status='editing';
}
function blkConfirmar(k){const b=S.blocks[k];b.draft=null;b.prev=null;b.status='confirmed';}
function blkCancelar(k){const b=S.blocks[k];b.draft=null;b.status=(b.prev&&b.prev!=='editing')?b.prev:'pending';b.prev=null;}
function blkGuardar(k){
  const b=S.blocks[k];
  if(!b.draft)return;
  BLOQUES[k].set(b.draft);
  b.draft=null;b.prev=null;b.status='modified';
  recomputeFromExt();            // re-deriva datos; no toca el estado de los demás bloques
}
/* re-deriva el estado calculado conservando todo lo que el usuario ya decidió */
/* cualquier cambio del estado invalida la vista previa existente */
function tocarEstado(){
  S.stateVersion=(S.stateVersion||0)+1;
  if(S.gen&&S.previewStatus!=='generating')S.previewStatus='outdated';
}
/* re-deriva SÓLO lo que depende del acuerdo leído. Nunca reinicializa productos,
   inflación, personas, forma de pago ni decisiones del usuario. */
function recomputeFromExt(){
  const E=normalizeExt(S.ext);
  S.ext=E;
  S.emp=Object.assign({},E.emp);
  ['responsable','factura','firmaCliente'].forEach(k=>{
    if(S.perKeep[k])S.per[k]=JSON.parse(JSON.stringify(E.per[k]));   // sólo si el usuario no lo cambió
  });
  S.per.firmaLapzo=Object.assign({},LAPZO_FIRMA);
  // vigencia: se actualizan las fechas del acuerdo anterior, no las decisiones de la renovación
  const ini=parseDate(E.vig.inicioRaw), ren=parseDate(E.vig.renovRaw);
  S.ren.prevInicio=ini;S.ren.prevRenov=ren;
  S.ren.mesesDet=(E.vig.meses!=null?E.vig.meses:null);S.ren.mesesDetRaw=E.vig.mesesRaw||'';
  if(!S.ren.inicio&&ren)S.ren.inicio=ren;
  if(S.ren.inicio)S.ren.renov=addMonths(S.ren.inicio,S.ren.meses||DURACION_ESTANDAR);
  // productos del acuerdo: se actualiza su BASE conservando lo que el usuario decidió
  const delAcuerdo=(S.prods||[]).filter(p=>!p.isNew&&!esRegalo(p));
  (E.prods||[]).forEach((np,k)=>{
    const t=delAcuerdo[k];
    if(!t)return;
    const antes=JSON.stringify(t.base);
    const nuevo=JSON.parse(JSON.stringify(np));
    t.base=nuevo;
    if(t.action==='keep'&&!t.priceEdited&&!t.cur.listaPubManual){
      const cur=JSON.parse(JSON.stringify(np));
      cur.lista=(np.final!=null?np.final:np.lista);
      cur.listaPub=t.cur.listaPub;cur.listaPubManual=t.cur.listaPubManual;
      t.cur=cur;                                  // seguía el acuerdo: se sincroniza
      t.revisar='';
    }else if(antes!==JSON.stringify(nuevo)){
      t.revisar='Cambió este producto en el acuerdo anterior. Revisa precio y licencias antes de generar.';
    }
  });
  if((E.prods||[]).length>delAcuerdo.length){
    (E.prods||[]).slice(delAcuerdo.length).forEach(np=>{
      const cur=JSON.parse(JSON.stringify(np));
      cur.lista=(np.final!=null?np.final:np.lista);cur.listaPub=null;cur.listaPubManual=false;
      S.prods.push({id:nextProdId('doc'),tipo:'ACUERDO',isNew:false,action:'keep',applyInfl:true,priceEdited:false,
        base:JSON.parse(JSON.stringify(np)),cur});
    });
  }
  // total de referencia del acuerdo anterior (si el usuario no lo fijó a mano)
  if(!S.baseTotalAntManual){
    const suma=round2((S.prods||[]).filter(p=>!p.isNew&&!esRegalo(p)&&esPagado(p.base)).reduce((a,p)=>a+(p.base.final||0),0));
    S.baseTotalAnt=E.cond.total!=null?E.cond.total:suma;
  }
  if(!S.colab.tocado){
    S.colab.ant=E.anexo.colaboradores||((E.prods[0]||{}).colaboradores||S.colab.ant||'');
    if(S.colab.mode==='keep')S.colab.nue=S.colab.ant;
  }
  S.pay.prevPagos=JSON.parse(JSON.stringify(E.cond.pagos||[]));
  if(S.pay.mode==='keep'){
    S.pay.dias=E.cond.dias||S.pay.dias;
    S.pay.n=S.pay.prevPagos.length||S.pay.n;
  }
  if(!S.logo.changed){S.logo.web=E.logo.web;S.logo.redes=E.logo.redes;}
  syncRegalosTaaS();
  syncAnexo();
  recalcPagos(S.pay.mode==='keep');
  // las inconsistencias se recalculan conservando las decisiones ya tomadas
  const prev={};(S.issues||[]).forEach(x=>{prev[x.id]={choice:x.choice,custom:x.custom};});
  S.issues=buildIssues().map(x=>Object.assign(x,prev[x.id]||{}));
}
/* =========================================================================
   VALIDACIONES ACCIONABLES (validar ≠ modificar estado)
   ========================================================================= */
function validateAgreement(E){
  const D=E||S.ext;
  if(!D)return [];
  const out=[];
  const add=o=>{
    o.sig=o.id+'|'+(o.values||[]).map(v=>String(v==null?'':v)).join('~');
    if(!S.okIssues||!S.okIssues[o.sig])out.push(o);
  };
  if(!D.emp.razon)add({id:'razon',severity:'error',block:'emp',field:'razon',
    message:'No hay razón social; es indispensable para el nuevo acuerdo.',values:[],resolvable:true});
  if(!D.emp.taxid)add({id:'rfc',severity:'warning',block:'emp',field:'taxid',
    message:'No fue posible identificar el RFC / Tax ID.',values:[],resolvable:true});
  if(!D.vig.renovRaw)add({id:'renov',severity:'error',block:'cond',field:'vig.renovRaw',
    message:'No hay fecha de renovación: de ahí arranca la nueva vigencia.',values:[],resolvable:true});

  // los productos no se validan aquí: sus pendientes viven en pendientesRevision()
  // la vigencia de la renovación se valida contra la duración ACTUAL del borrador
  if(S.ren&&S.ren.inicio){
    const fin=addMonths(S.ren.inicio,S.ren.meses||DURACION_ESTANDAR);
    if(!fin)add({id:'vigcalc',severity:'error',block:'cond',field:'renewalMeses',
      message:'No fue posible calcular el fin de la nueva vigencia con la duración indicada.',values:[],resolvable:true});
    else if(S.ren.renov&&(fin.y!==S.ren.renov.y||fin.m!==S.ren.renov.m||fin.d!==S.ren.renov.d))
      add({id:'vigcalc',severity:'warning',block:'cond',field:'renewalMeses',
        message:'El fin de la nueva vigencia ('+dEs(S.ren.renov)+') no corresponde al inicio más '+(S.ren.meses||DURACION_ESTANDAR)+' meses ('+dEs(fin)+').',
        values:[dEs(S.ren.renov),dEs(fin)],resolvable:true});
  }
  const sumaP=(D.cond.pagos||[]).reduce((a,x)=>a+(parseNum(x.montoRaw)||0),0);
  if(D.cond.total&&sumaP&&Math.abs(sumaP-D.cond.total)>1)
    add({id:'pagos',severity:'warning',block:'cond',field:'cond.totalRaw',
      message:'La suma de las parcialidades del acuerdo anterior ('+money(sumaP)+') no coincide con el valor total ('+money(D.cond.total)+').',
      values:[String(sumaP),String(D.cond.total)],resolvable:true});
  if(!D.per.firmaCliente.nombre)
    add({id:'firmante',severity:'warning',block:'per',field:'firmaCliente.nombre',
      message:'No se obtuvo el firmante del cliente de texto impreso confiable.',values:[],resolvable:true});
  return out;
}
/* =========================================================================
   PENDIENTES DE REVISIÓN — avisos que se resuelven en su paso, no bloqueos
   ========================================================================= */
function pendientesRevision(){
  const out=[];
  let n=0;
  const add=o=>{o.id='review-'+String(++n).padStart(3,'0');o.resolved=false;out.push(o);};
  (S.prods||[]).filter(p=>p.action!=='del').forEach(p=>{
    const nom=(p.cur.nombre||p.base.nombre||'producto').slice(0,40);
    // los regalos y los productos sin costo no requieren licencias
    if(esPagado(p.cur)&&!esRegalo(p)&&!String(p.cur.licenciasRaw||'').trim())
      add({category:'PRODUCT',productId:p.id,field:'licenses',critico:true,targetStep:6,
        producto:nom,message:'Falta confirmar cantidad de licencias'});
    if(esPagado(p.cur)&&!esRegalo(p)&&chainOf(p).fin<=0)
      add({category:'PRODUCT',productId:p.id,field:'finalPrice',critico:true,targetStep:6,
        producto:nom,message:'Falta confirmar el valor final'});
    if((p.cur.pricing||'priced')==='unknown')
      add({category:'PRODUCT',productId:p.id,field:'pricingStatus',critico:true,targetStep:6,
        producto:nom,message:'Falta confirmar la condición económica'});
    const lic=String(p.cur.licenciasRaw||'').replace(/[^\d]/g,''),pl=String(p.cur.plazoRaw||'').replace(/[^\d]/g,'');
    if(lic&&pl&&lic===pl)
      add({category:'PRODUCT',productId:p.id,field:'licenses',critico:false,targetStep:6,
        producto:nom,message:'Licencias y plazo tienen el mismo valor: confirma la cantidad de licencias'});
  });
  if(!liveProds().length)
    add({category:'PRODUCT',productId:null,field:'products',critico:true,targetStep:6,
      producto:'Productos',message:'La renovación no tiene productos'});
  if(S.colab&&S.colab.mode==='chg'&&!String(S.colab.nue||'').trim())
    add({category:'PRODUCT',productId:null,field:'collaborators',critico:false,targetStep:6,
      producto:'Colaboradores',message:'Falta capturar el nuevo número de colaboradores'});
  return out;
}
const pendientesCriticos=()=>pendientesRevision().filter(x=>x.critico);
/* panel informativo: nunca bloquea, sólo avisa dónde se resolverá */
function revisionPosteriorHtml(paso){
  const P=pendientesRevision();
  if(!P.length)return '';

  P.forEach(x=>{(grupos[x.producto]=grupos[x.producto]||[]).push(x);});

/* abre el bloque, hace scroll, enfoca y resalta el campo */
function goToField(blockId,fieldId){
  if(blockId==='prod'){S.step=6;render();return;}   // los productos se administran en el paso 6
  if(!BLOQUES[blockId])return;
  if(blkStatus(blockId)!=='editing')blkEditar(blockId);
  S.focusField={block:blockId,field:fieldId};
  S.step=1;render();
}
function aplicarFoco(){
  if(!S.focusField)return;
  const f=S.focusField;S.focusField=null;
  const el=document.getElementById('fld-'+f.block+'-'+String(f.field).replace(/\./g,'_'));
  const cont=document.getElementById('blk-'+f.block);
  const t=el||cont;
  if(t&&t.scrollIntoView)t.scrollIntoView({behavior:'smooth',block:'center'});
  if(el){
    try{el.focus({preventScroll:true});}catch(e){el.focus();}
    el.classList.add('hl');
    setTimeout(()=>{el.classList.remove('hl');},2800);
  }
}
/* ---------------- Anexo A: filas comparativas, años y vigencia ---------------- */
const normN=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function seedFilasAnexo(E){
  const mods=(E.anexo.modulos||[]).map(m=>({n:normN(m.nombre),v:String(m.valor||'').trim()}));
  const prodTxt=normN((E.prods||[]).map(p=>p.nombre+' '+(p.modulos||[]).join(' ')+' '+(p.descripcion||'')).join(' '));
  return ANEXO_FILAS.map(nombre=>{
    const key=normN(nombre);
    let val='';
    const hit=mods.find(m=>m.n&&(m.n.indexOf(key.split(' ')[0])>=0||key.indexOf(m.n.split(' ')[0])>=0));
    if(hit)val=hit.v;
    else if(/colaborador/.test(key))val=E.anexo.colaboradores||'';
    else if(prodTxt&&key.split(' ')[0].length>4&&prodTxt.indexOf(key.split(' ')[0])>=0)val='Sí';
    else val='No';
    return {nombre,ant:val,nue:val};
  });
}
function anexoAnios(){
  const d=S.anexo.data;
  const auto=S.ren.renov?S.ren.renov.y:(S.ren.inicio?S.ren.inicio.y+1:new Date().getFullYear());
  const anio=(d.anioAuto||!d.anio)?auto:+d.anio;
  return {nue:anio,ant:anio-1};
}
function vigenciaTexto(){
  const d=S.anexo.data;
  if(!d.vigenciaAuto&&d.vigencia)return d.vigencia;
  const f=S.envio?addMonths(S.envio,1):null;
  return f?'Propuesta con vigencia al '+fechaLarga(f):'';
}
/* mantiene el Anexo alineado con el cuerpo del acuerdo */
function syncAnexo(){
  if(!S.anexo||!S.anexo.data||!S.colab)return;
  const d=S.anexo.data;
  if(S.pay&&S.pay.plan&&!d.esquemaManual)d.esquema='Esquema '+(PLANES[S.pay.plan]?PLANES[S.pay.plan].l:'Anual');
  const col=d.filas.find(f=>/colaborador/.test(normN(f.nombre)));
  if(col){col.ant=S.colab.ant||col.ant;col.nue=S.colab.mode==='keep'?(S.colab.ant||col.ant):(S.colab.nue||'');}
  d.vigencia=vigenciaTexto();
  const a=anexoAnios();d.anio=a.nue;
}

/* ---------------- cálculo por producto ---------------- */
/* la duración leída del PDF sólo es referencia: la regla de negocio son 12 meses */
function duracionInfo(){
  const r=S.ren||{};
  const det=r.mesesDet;
  const raroDet=det!=null&&det!==DURACION_ESTANDAR;
  return {detected:det,detectedRaw:r.mesesDetRaw||'',normalized:DURACION_ESTANDAR,
    used:r.meses||DURACION_ESTANDAR,source:r.mesesSource||'default',
    confidence:raroDet?'low':'high',
    reason:raroDet?'La duración estándar de los acuerdos Lapzo es de '+DURACION_ESTANDAR+' meses':''};
}
/* agrega o retira los regalos según el producto principal; nunca aplica a otros planes */
function syncRegalosTaaS(){
  if(!S.prods)return;
  const taas=hayTaaS();
  if(!taas){
    // regla condicional: sin TaaS los regalos no existen en el acuerdo ni en el Anexo
    const habia=S.prods.some(esRegalo);
    S.prods=S.prods.filter(p=>!esRegalo(p));
    if(habia&&S.anexo&&S.anexo.data)S.anexo.data.filas=(S.anexo.data.filas||[]).filter(f=>!f.regalo);
    S.taasApplied=false;
    syncFilasDesdeProductos();
    normalizarColumnaAnterior();      // la columna histórica sí conserva su normalización
    return;
  }
  REGALOS_TAAS.forEach(g=>{
    if(S.prods.some(p=>p.giftSlot===g.slot))return;
    const base={pricing:'gift',pricingLabel:g.label,nombre:g.nombre,plan:'',descripcion:'',modulos:[],
      licenciasRaw:'',colaboradores:'',plazoRaw:'',lista:null,listaRaw:'',final:null,finalRaw:'',descTipo:'pct',descVal:0};
    S.prods.push({id:nextProdId('gift'),tipo:'REGALO',isNew:true,action:'mod',applyInfl:false,priceEdited:false,
      giftSlot:g.slot,giftFijo:!!g.fijo,
      base:JSON.parse(JSON.stringify(base)),
      cur:Object.assign(JSON.parse(JSON.stringify(base)),{giftEstado:g.estado,plazoRaw:''})});
  });
  // el Anexo A de TaaS lleva los módulos estándar y las filas de regalo, una sola vez
  if(S.anexo&&S.anexo.data){
    const d=S.anexo.data;
    if(!S.taasApplied){
      ANEXO_TAAS.forEach(nombre=>{
        const f=(d.filas||[]).find(x=>normN(x.nombre)===normN(nombre));
        if(f)f.nue='Sí';
        else d.filas.push({nombre,ant:'No',nue:'Sí'});
      });
      S.taasApplied=true;
    }
    // Cursos Bolt no se palomea por tener TaaS: sólo si se contrató explícitamente
    const fb=(d.filas||[]).find(x=>RE_BOLT.test(x.nombre));
    if(fb)fb.nue=boltContratado()?'Sí':'No';
    else d.filas.push({nombre:'Cursos Bolt',ant:'No',nue:boltContratado()?'Sí':'No'});
  }
  syncFilasDesdeProductos();
  normalizarColumnaAnterior();
  if(S.anexo&&S.anexo.data){
    const d=S.anexo.data;
    d.filas=(d.filas||[]).filter(f=>!f.regalo||S.prods.some(p=>esRegalo(p)&&p.giftSlot===f.regalo&&regaloTitulo(p)));
    S.prods.filter(esRegalo).forEach(p=>{
      const tit=regaloTitulo(p);
      if(!tit)return;                       // sin nombre definido no se inventa nada
      const f=(d.filas||[]).find(x=>x.regalo===p.giftSlot);
      if(f){f.nombre=tit;f.nue='Regalo';f.ant='No';}
      else d.filas.push({nombre:tit,ant:'No',nue:'Regalo',regalo:p.giftSlot});
    });
  }
}
/* si el año anterior el producto principal era TaaS, la columna anterior se
   normaliza con la suite estándar: sin Cursos Bolt ni Gestión de personal,
   salvo evidencia explícita en el documento histórico */
/* la columna de la renovación se arma con los productos configurados en el paso 6 */
function syncFilasDesdeProductos(){
  if(!S.anexo||!S.anexo.data)return;
  const d=S.anexo.data;
  const vivos=liveProds().filter(p=>!esRegalo(p));
  const taas=hayTaaS();
  const contratado=nombre=>{
    const key=normN(nombre);
    return vivos.some(p=>{
      const txt=normN((p.cur.nombre||'')+' '+(p.cur.descripcion||'')+' '+(p.cur.modulos||[]).join(' '));
      return normN(p.cur.nombre)===key||filaCoincideCon(nombre,txt);
    });
  };
  CATALOGO_PRODUCTOS.filter(it=>it.tipo==='MODULO').forEach(it=>{
    const f=(d.filas||[]).find(x=>normN(x.nombre)===normN(it.n)||filaCoincideCon(x.nombre,it.n));
    const incluido=(taas&&ANEXO_TAAS.some(n=>normN(n)===normN(it.n)))||contratado(it.n);
    if(f)f.nue=incluido?'Sí':'No';
    else d.filas.push({nombre:it.n,ant:'No',nue:incluido?'Sí':'No'});
  });
  const fb=(d.filas||[]).find(x=>RE_BOLT.test(x.nombre));
  if(fb)fb.nue=boltContratado()?'Sí':'No';
  const gp=(S.prods||[]).find(p=>p.action!=='del'&&/gesti[oó]n\s+de\s+personal/i.test(p.cur.nombre||''));
  const fg=(d.filas||[]).find(x=>x.regalo||/gesti[oó]n\s+de\s+personal/i.test(x.nombre));
  if(fg&&!gp)fg.nue='No';
  if(fg&&gp)fg.nue=esPagado(gp.cur)?'Sí':'Regalo';
}
function normalizarColumnaAnterior(){
  if(!S.anexo||!S.anexo.data)return;
  const d=S.anexo.data;
  if(!taasAnterior())return;
  if(!S.taasAntApplied){
    ANEXO_TAAS.forEach(nombre=>{
      const f=(d.filas||[]).find(x=>normN(x.nombre)===normN(nombre));
      if(f)f.ant='Sí';
      else d.filas.push({nombre,ant:'Sí',nue:'No'});
    });
    S.taasAntApplied=true;
  }
  const fb=(d.filas||[]).find(x=>RE_BOLT.test(x.nombre));
  if(fb)fb.ant=boltAnterior()?'Sí':'No';
  // Gestión de personal nunca se atribuye retroactivamente
  (d.filas||[]).filter(f=>f.regalo||/gesti[oó]n\s+de\s+personal/i.test(f.nombre))
    .forEach(f=>{f.ant=gestionAnterior()?'Sí':'No';});
}
function regalosPendientes(){
  return (S.prods||[]).filter(p=>esRegalo(p)&&!regaloTitulo(p));
}
function chainOf(p){
  const infl=S.ren.infl==null?0:S.ren.infl;
  const c=p.cur;
  if(!esPagado(c)){
    // obsequio / incluido / bonificado / sin costo: no lleva importe ni inflación
    return {ant:null,antFinal:null,baseP:0,useInfl:false,infl:0,act:0,
            descTipo:c.descTipo||'pct',descVal:0,desc:0,fin:0,
            listaPub:0,listaAuto:0,listaManual:false,
            pricing:c.pricing,texto:pricingLabel(c)};
  }
  // el valor de referencia es el PRECIO FINAL / VALOR CONTRATADO del acuerdo anterior
  const ant=p.isNew?null:(p.base.final!=null?p.base.final:(p.base.lista||0));
  const baseP=c.lista!=null?c.lista:(ant||0);
  const useInfl=p.isNew?!!p.applyInfl:(p.priceEdited?!!p.applyInfl:true);
  const R=S.roundInt?(v=>Math.round(v)):round2;
  const act=R(baseP*(useInfl?(1+infl/100):1));
  // el descuento sólo se calcula si el importe capturado es ANTERIOR al descuento
  const pt=priceTypeOf(c);
  let desc=0;
  if(pt!=='FINAL_CONTRACTED'){
    if(c.descTipo==='monto')desc=R(Math.min(c.descVal||0,act));
    else desc=R(act*((c.descVal||0)/100));
  }
  const fin=R(act-desc);
  // precio lista de presentación: valor final + 10% (automático, editable, NO es descuento)
  const listaPub=c.listaPubManual&&c.listaPub!=null?R(c.listaPub):R(fin*FACTOR_LISTA);
  return {ant,antFinal:p.isNew?null:(p.base.final||0),baseP,useInfl,infl,act,priceType:pt,
          descTipo:c.descTipo,descVal:pt==='FINAL_CONTRACTED'?0:(c.descVal||0),desc,fin,
          listaPub,listaAuto:R(fin*FACTOR_LISTA),listaManual:!!c.listaPubManual};
}
const liveProds=()=>S.prods.filter(p=>p.action!=='del');
function totalNuevo(){return round2(liveProds().reduce((a,p)=>a+chainOf(p).fin,0));}
function totalAnterior(){return round2(S.baseTotalAnt||0);}
/* precio lista de la propuesta anterior: el del acuerdo o, si no venía, valor final +10% */
function totalListaAnterior(){
  const bases=(S.prods||[]).map(p=>p.base).filter(b=>esPagado(b));
  const suma=round2(bases.reduce((a,b)=>a+(b.lista!=null?b.lista:(b.final||0)),0));
  const ant=totalAnterior();
  if(suma>ant+0.5)return suma;
  return round2((ant||suma)*FACTOR_LISTA);
}
function totalListaNuevo(){return round2(liveProds().reduce((a,p)=>a+chainOf(p).listaPub,0));}
function totalActualizado(){return round2(liveProds().reduce((a,p)=>a+chainOf(p).act,0));}
/* porcentaje de descuento EXPLÍCITO (nunca derivado de lista vs final) */
/* descuento explícito que traía el acuerdo anterior */
function descExplicitoAnteriorPct(){
  const bases=(S.prods||[]).map(p=>p.base).filter(b=>esPagado(b)&&(b.descVal||0)>0&&b.descTipo==='pct');
  if(!bases.length)return 0;
  const p0=round2(bases[0].descVal);
  return bases.every(b=>round2(b.descVal)===p0)?p0:0;
}
function descExplicitoPct(){
  const conDesc=liveProds().filter(p=>(p.cur.descVal||0)>0);
  if(!conDesc.length)return 0;
  // si todos los descuentos explícitos son el mismo porcentaje, ese es el que se comunica
  const pcts=conDesc.filter(p=>p.cur.descTipo==='pct').map(p=>round2(p.cur.descVal));
  if(pcts.length===conDesc.length&&pcts.every(v=>v===pcts[0]))return pcts[0];
  const act=totalActualizado(),fin=totalNuevo();
  if(!act||fin>=act)return 0;
  return Math.round((1-fin/act)*1000)/10;
}

/* ---------------- plan de pagos ---------------- */
const PLANES={
  ANUAL:{l:'Anual',n:1,paso:0},
  MENSUAL:{l:'Mensual',n:12,paso:1},
  SPLIT:{l:'Split',n:2,paso:3},
  SEMESTRAL:{l:'Semestral',n:2,paso:6},
  PERSONALIZADO:{l:'Personalizado',n:0,paso:1}
};
let PAYSEQ=0;
const nextPayId=()=>'payment-'+String(++PAYSEQ).padStart(3,'0');
function planDetectado(prev){
  const n=(prev||[]).length;
  if(n<=1)return 'ANUAL';
  if(n===12)return 'MENSUAL';
  if(n===2){
    const a=parseDate(prev[0].fechaRaw),b=parseDate(prev[1].fechaRaw);
    if(a&&b)return ((b.y-a.y)*12+(b.m-a.m))>=5?'SEMESTRAL':'SPLIT';
    return 'SPLIT';
  }
  return 'PERSONALIZADO';
}
/* reparte el total sin que el redondeo genere diferencias */
function repartir(total,n){
  const R=S.roundInt?(v=>Math.floor(v)):(v=>Math.floor(v*100)/100);
  const per=n?R(total/n):0;
  const out=[];
  for(let i=0;i<n;i++)out.push(i===n-1?round2(total-per*(n-1)):per);
  return out;
}
/* fechas por defecto del plan, contadas desde el inicio de la nueva vigencia */
function fechasDePlan(plan,n){
  const ini=S.ren.inicio,P=PLANES[plan]||PLANES.ANUAL;
  const cuantos=plan==='PERSONALIZADO'?Math.max(1,n||S.pay.n||1):P.n;
  const out=[];
  for(let i=0;i<cuantos;i++)out.push(ini?addMonths(ini,i*(P.paso||0)):null);
  return out;                                  // addMonths recorta al último día válido del mes
}
function generarPagos(plan,n){
  const total=totalNuevo();
  const fechas=fechasDePlan(plan,n);
  const montos=repartir(total,fechas.length);
  S.pay.plan=plan;S.pay.n=fechas.length;S.pay.totalRef=total;
  S.pay.iniRef=S.ren.inicio?dISO(S.ren.inicio):'';
  S.pay.pagos=fechas.map((f,i)=>({id:nextPayId(),fecha:f,fechaRaw:dEs(f),
    monto:montos[i],montoRaw:'',fechaManual:false,valorManual:false}));
  S.pay.avisoFecha=false;S.pay.avisoTotal=null;
}
function validarFechasPago(){
  const out=[],ps=S.pay.pagos||[];
  const nums=ps.map(p=>p.fecha?dNum(p.fecha):null);
  if(nums.some(x=>!x))out.push('Hay pagos sin fecha válida.');
  const vistos={};
  nums.forEach((x,i)=>{if(x){if(vistos[x])out.push('Las facturas '+vistos[x]+' y '+(i+1)+' tienen la misma fecha.');else vistos[x]=i+1;}});
  for(let i=1;i<nums.length;i++)if(nums[i]&&nums[i-1]&&nums[i]<nums[i-1]){out.push('Las fechas no van en orden cronológico (factura '+(i+1)+').');break;}
  return out;
}
function recalcPagos(fromPrev){
  const total=totalNuevo();
  if(!S.pay.plan){                                  // primera vez: el plan se deduce del acuerdo anterior
    const plan=planDetectado(S.pay.prevPagos);
    S.pay.n=plan==='PERSONALIZADO'?(S.pay.prevPagos.length||1):PLANES[plan].n;
    generarPagos(plan,S.pay.n);
    if(fromPrev&&S.pay.prevPagos.length===S.pay.pagos.length&&S.ren.prevInicio&&S.ren.inicio){
      S.pay.pagos.forEach((pg,k)=>{               // conserva los desfases y el formato del acuerdo anterior
        const d=parseDate(S.pay.prevPagos[k].fechaRaw);
        if(!d)return;
        const off=(d.y-S.ren.prevInicio.y)*12+(d.m-S.ren.prevInicio.m);
        const t=addMonths(S.ren.inicio,off);
        if(t){pg.fecha={y:t.y,m:t.m,d:Math.min(d.d,new Date(Date.UTC(t.y,t.m,0)).getUTCDate())};
              pg.fechaRaw=fmtLikeDate(S.pay.prevPagos[k].fechaRaw,pg.fecha);}
        pg.montoRaw=S.pay.prevPagos[k].montoRaw||'';
      });
    }
    return;
  }
  const ps=S.pay.pagos||[];
  if(!ps.length){generarPagos(S.pay.plan,S.pay.n);return;}
  const iniISO=S.ren.inicio?dISO(S.ren.inicio):'';
  if(iniISO!==S.pay.iniRef){                        // cambió el inicio de la vigencia
    if(!ps.some(p=>p.fechaManual)){
      fechasDePlan(S.pay.plan,ps.length).forEach((f,k)=>{if(ps[k]){ps[k].fecha=f;ps[k].fechaRaw=dEs(f);}});
      S.pay.iniRef=iniISO;S.pay.avisoFecha=false;
    }else S.pay.avisoFecha=true;                    // hay fechas manuales: se pregunta antes de tocarlas
  }
  const libres=ps.filter(p=>!p.valorManual);
  const fijado=round2(ps.filter(p=>p.valorManual).reduce((a,p)=>a+(p.monto||0),0));
  if(!libres.length){
    S.pay.avisoTotal=Math.abs(sumaPagos()-total)>0.5?{suma:sumaPagos(),total:total}:null;
  }else{
    const montos=repartir(Math.max(0,round2(total-fijado)),libres.length);
    libres.forEach((p,k)=>{p.monto=montos[k];});
    S.pay.avisoTotal=null;
  }
  S.pay.totalRef=total;
}
const sumaPagos=()=>round2((S.pay.pagos||[]).reduce((a,p)=>a+(p.monto||0),0));
const pagosOk=()=>Math.abs(sumaPagos()-totalNuevo())<0.02;
